<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Ops Runbook · 支付客服作业手册</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0F14; --panel:#11161D; --panel-alt:#161D26; --panel-alt2:#1B232E;
    --border:#232C38; --border-soft:#1B232E;
    --text:#E7ECF2; --muted:#8B98A5; --muted-2:#5E6B79;
    --accent:#3ED9A6; --accent-dim:#123128; --accent-line:#256B54;
    --info:#5B9DF9; --info-dim:#132238; --info-line:#274a7a;
    --success:#34D399; --success-dim:#0F2A22; --success-line:#1F5A46;
    --fail:#F2545B; --fail-dim:#2A1518; --fail-line:#5A2226;
    --warn:#F5A524; --warn-dim:#2A2008; --warn-line:#5A4718;
    --radius:5px;
    --sans:'IBM Plex Sans', -apple-system, sans-serif;
    --mono:'IBM Plex Mono', ui-monospace, monospace;
    --subtitle-size:11px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg); color:var(--text); font-family:var(--sans); font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;}
  /* lock the whole tool to one font — even a stray inline style (e.g. from a
     paste that slipped past the plain-text guard) can never override this */
  body, body *{font-family:var(--sans) !important;}
  button{font-family:var(--sans);}

  .topbar{position:sticky; top:0; z-index:10; background:rgba(11,15,20,.94); backdrop-filter:blur(6px); border-bottom:1px solid var(--border);}
  .topbar-row1{display:flex; align-items:center; gap:12px; padding:10px 20px 8px;}
  .brand{display:flex; align-items:center; gap:8px; font-weight:600; font-size:14px; white-space:nowrap;}
  .sync-status{font-family:var(--sans); font-size:10.5px; font-weight:500; padding:2px 8px; border-radius:10px; background:var(--panel-alt2); color:var(--muted-2); white-space:nowrap;}
  .sync-status.ok{color:var(--success);}
  .sync-status.busy{color:var(--accent);}
  .sync-status.err{color:var(--fail);}
  body.sync-loading::before{content:'读取共用资料中…'; position:fixed; inset:0; z-index:9999; background:var(--bg); color:var(--muted); display:flex; align-items:center; justify-content:center; font-size:14px;}
  .brand .dot{width:8px; height:8px; background:var(--accent); border-radius:2px;}
  .search{flex:1; max-width:320px; position:relative;}
  .search input{width:100%; background:var(--panel-alt); border:1px solid var(--border); color:var(--text);
    padding:7px 10px 7px 30px; border-radius:var(--radius); font-size:13px; outline:none;}
  .search input:focus{border-color:var(--accent);}
  .search svg{position:absolute; left:9px; top:8px; opacity:.5;}
  .topbar-actions{display:flex; gap:8px; margin-left:auto;}
  .btn{font-size:12px; font-weight:500; padding:6px 11px; border-radius:var(--radius); border:1px solid var(--border);
    background:var(--panel-alt); color:var(--muted); cursor:pointer; white-space:nowrap;}
  .btn:hover{color:var(--text); border-color:#33404F;}
  .btn.on{background:var(--accent-dim); color:var(--accent); border-color:var(--accent-line);}

  .tabs{display:flex; gap:4px; padding:0 20px 10px; overflow-x:auto;}
  .tab{font-size:13px; font-weight:600; padding:7px 14px; border-radius:6px 6px 0 0; cursor:pointer; color:var(--muted); border:1px solid transparent; white-space:nowrap;}
  .tab:hover{color:var(--text);}
  .tab.active{color:var(--accent); background:var(--panel); border-color:var(--border); border-bottom-color:var(--panel);}
  .tab-draggable{cursor:grab;}
  .tab.dragging{opacity:.4;}
  .tab-add{color:var(--accent); border:1px dashed var(--accent-line);}
  .tab.tab-drop-target{background:var(--accent-dim); box-shadow:inset 0 0 0 2px var(--accent);}
  .tab-restore{color:var(--muted-2); border:1px dashed var(--border);}
  .tab-del{margin-left:4px; color:var(--muted-2); font-size:11px;}
  .tab-del:hover{color:var(--fail);}

  .stage{max-width:980px; margin:0 auto; padding:18px 20px 60px;}

  .grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(200px,1fr)); gap:10px;}
  .tile{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:13px 14px; cursor:pointer; display:flex; flex-direction:column; gap:6px; min-height:84px;}
  .tile:hover{border-color:#33404F; background:var(--panel-alt);}
  .tile.draggable{cursor:grab;}
  .tile.dragging{opacity:.35;}
  .tile-actions{position:absolute; top:9px; right:10px; display:flex; align-items:center; gap:8px;}
  .drag-handle{color:var(--muted-2); font-size:13px; cursor:grab; line-height:1;}
  .tile{position:relative;}
  .tile-del-wf{font-size:13px; line-height:1; cursor:pointer; color:var(--muted); font-weight:600; opacity:.6;}
  .tile-del-wf:hover{opacity:1; color:var(--accent);}
  .tile-kind{font-family:var(--sans); font-size:10px; color:var(--muted-2); text-transform:uppercase; letter-spacing:.4px; border:1px solid transparent; border-radius:3px; padding:1px 4px; display:inline-block;}
  .tile-kind-row{display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
  .tag-pill{font-family:var(--sans); font-size:10px; border:1px solid var(--border); border-radius:10px; padding:1px 7px; cursor:pointer; display:inline-flex; align-items:center; gap:4px;}
  .tag-pill.dragging{opacity:.35;}
  .tag-del{font-size:11px; opacity:.7;}
  .tag-del:hover{opacity:1;}
  .tag-add{font-family:var(--sans); font-size:10px; color:var(--muted-2); border:1px dashed var(--border); border-radius:10px; padding:1px 7px; cursor:pointer;}
  .tag-add:hover{color:var(--accent); border-color:var(--accent-line);}
  .tile-add{align-items:center; justify-content:center; color:var(--muted); border:1px dashed var(--border); cursor:pointer; font-size:13px;}
  .tile-add:hover{color:var(--accent); border-color:var(--accent-line);}
  .tile-title{font-weight:600; font-size:14px; line-height:1.35;}
  .tile-desc{font-size:12px; color:var(--muted); line-height:1.4; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .search-tag{display:inline-block; font-family:var(--sans); font-size:10px; color:var(--accent); margin-bottom:2px;}

  .detail{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:18px 22px 20px;}
  .detail-head{display:flex; align-items:flex-start; gap:10px; margin-bottom:10px;}
  .back{font-size:12px; color:var(--muted); cursor:pointer; padding:5px 9px; border:1px solid var(--border); border-radius:var(--radius); flex:0 0 auto; background:var(--panel-alt);}
  .back:hover{color:var(--text);}
  .detail-title{font-size:18px; font-weight:700; margin:0;}
  .detail-context{color:var(--muted); font-size:13px; margin:2px 0 14px; max-width:680px;}
  [contenteditable="true"]{outline:1px dashed transparent; border-radius:3px;}
  body.edit-mode [contenteditable="true"]:hover{outline:1px dashed #33404F;}
  body.edit-mode [contenteditable="true"]:focus{outline:1px dashed var(--accent); background:var(--panel-alt);}
  body.edit-mode [contenteditable="true"]:empty{min-width:60px; min-height:1.4em; display:inline-block;}
  body.edit-mode [contenteditable="true"]:empty::before{content:'点击输入…'; color:var(--muted-2); opacity:.6; pointer-events:none;}

  .pickrow{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px;}
  .pickrow-label{font-family:var(--sans); font-size:var(--subtitle-size, 11px); color:var(--muted-2); width:100%; margin-bottom:2px;}
  .section-label{font-family:var(--sans); font-size:11px; font-weight:700; color:var(--accent); text-transform:uppercase; letter-spacing:.5px; margin:14px 0 6px; padding-bottom:4px; border-bottom:1px solid var(--border-soft);}
  .pill{font-size:12px; font-weight:600; padding:6px 12px; border-radius:16px; border:1px solid var(--border); background:var(--panel-alt); color:var(--muted); cursor:pointer;}
  .pill-del{margin-left:6px; font-weight:400; color:var(--muted-2); cursor:pointer;}
  .pill-del:hover{color:var(--fail);}
  .pill-restore, .pill-add, .tmpl-variant-add{display:inline-flex; align-items:center; font-size:11.5px; padding:6px 12px; border-radius:16px; border:1px dashed var(--border); color:var(--muted-2); cursor:pointer; background:transparent;}
  .pill-add:hover, .pill-restore:hover, .tmpl-variant-add:hover{color:var(--accent); border-color:var(--accent-line);}
  .pill:hover{border-color:#33404F; color:var(--text);}
  .pill.sel{background:var(--info-dim); color:var(--info); border-color:var(--info-line);}
  .pill.dragging{opacity:.35;}
  .pill.drop-before{box-shadow:inset 3px 0 0 0 var(--accent);}
  .pill.drop-after{box-shadow:inset -3px 0 0 0 var(--accent);}
  .tmpl-toggle-row{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:6px;}
  .pill.pill-moved{animation:pillMovedFlash .9s ease;}
  .extra-btn{cursor:grab;}
  .extra-btn.dragging{opacity:.35;}
  .extra-btn.drop-before{box-shadow:inset 3px 0 0 0 var(--accent);}
  .extra-btn.drop-after{box-shadow:inset -3px 0 0 0 var(--accent);}
  .extra-btn.extra-moved{animation:pillMovedFlash .9s ease;}
  @keyframes pillMovedFlash{0%{background:var(--accent-dim); border-color:var(--accent-line);} 100%{background:transparent;}}
  .steps > li[draggable="true"]{cursor:grab;}
  .steps > li.dragging{opacity:.4;}
  .steps > li.dragging-paired{opacity:.6; outline:1px dashed var(--accent-line);}
  .steps > li.drop-before{box-shadow:inset 0 3px 0 0 var(--accent);}
  .steps > li.drop-after{box-shadow:inset 0 -3px 0 0 var(--accent);}
  .steps > li.step-moved{animation:pillMovedFlash .9s ease;}
  .steps > li.reply-in-steps{counter-increment:none; padding-left:0; cursor:grab;}
  .steps > li.reply-in-steps::before{content:none;}
  .pill.sel.tone-success{background:var(--success-dim); color:var(--success); border-color:var(--success-line);}
  .pill.sel.tone-fail{background:var(--fail-dim); color:var(--fail); border-color:var(--fail-line);}
  .pill.sel.tone-warn{background:var(--warn-dim); color:var(--warn); border-color:var(--warn-line);}

  .result{border-top:1px solid var(--border-soft); padding-top:12px; margin-top:6px;}
  .steps{list-style:none; margin:0 0 4px; padding:0; counter-reset:step;}
  .steps > li{counter-increment:step; position:relative; padding:6px 0 10px 26px; font-size:13px; color:var(--text);}
  .steps > li.restore-hidden-li{counter-increment:none; padding-left:4px;}
  .restore-hidden-li{font-size:12px; color:var(--muted-2); cursor:pointer; list-style:none;}
  .restore-hidden-li:hover{color:var(--accent);}
  .steps > li::before{content:counter(step); position:absolute; left:0; top:6px; width:17px; height:17px; border-radius:4px; background:var(--panel-alt2); color:var(--muted); font-family:var(--sans); font-size:10px; font-weight:600; display:flex; align-items:center; justify-content:center;}
  .steps.steps-unnumbered > li{padding-left:0;}
  .steps.steps-unnumbered > li::before{content:none;}
  .steps > li.restore-hidden-li::before{content:none;}
  .steps > li.steps-action-li{counter-increment:none; padding-left:4px; list-style:none; display:inline-block; margin-right:10px;}
  .steps > li.steps-action-li::before{content:none;}
  .step-main{}
  .step-sub{font-size:12px; color:var(--muted-2); margin-top:2px;}

  .replybox{background:var(--panel-alt); border:1px solid var(--border); border-radius:var(--radius); padding:9px 11px; display:flex; align-items:flex-start; gap:9px; max-height:190px; overflow-y:auto;}
  .replybox .rlabel{position:sticky; top:0;}
  .replybox .rtext{flex:1; font-family:var(--sans); font-size:12px; color:var(--accent); white-space:pre-wrap; line-height:1.5; outline:none;}
  .replybox .rtext:focus{background:rgba(255,255,255,.03); border-radius:3px;}
  .replybox.internal .rtext{color:var(--info);}
  .tmpl-label{font-family:var(--sans); font-size:10px; color:var(--muted-2); text-transform:uppercase; letter-spacing:.3px; margin:8px 0 2px;}
  .intro-wrap{position:relative;}
  .intro-del{display:inline-block; margin-top:4px; font-size:11px; color:var(--muted-2); cursor:pointer;}
  .intro-del:hover{color:var(--fail);}
  .intro-restore, .intro-add{display:inline-flex; align-items:center; font-size:11.5px; padding:5px 9px; border-radius:4px; border:1px dashed var(--border); color:var(--muted-2); cursor:pointer; background:transparent;}
  .intro-add:hover, .intro-restore:hover{color:var(--accent); border-color:var(--accent-line);}
  .tmplbox-wrap{margin-top:6px;}
  .tmplbox-head{display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .tmplbox-del{color:var(--muted-2); cursor:pointer; font-size:11px;}
  .tmplbox-del:hover{color:var(--fail);}
  .tmplbox-restore{display:inline-flex; align-items:center; font-size:11.5px; padding:5px 9px; margin:6px 0; border-radius:4px; border:1px dashed var(--border); color:var(--muted-2); cursor:pointer; background:transparent;}
  .tmplbox-restore:hover{color:var(--accent); border-color:var(--accent-line);}
  .tmplbox-head .tmpl-label{margin:0;}
  .tmplbox-body{display:flex; flex-direction:column; gap:6px; margin-top:4px;}
  .lang-tag{flex:0 0 auto; align-self:flex-start; margin-top:1px; font-family:var(--sans); font-size:10px; font-weight:700; color:var(--muted-2); background:var(--bg); border:1px solid var(--border); border-radius:3px; padding:2px 6px;}
  .add-lang-btn{align-self:flex-start; font-size:11px; padding:5px 10px; background:var(--accent-dim); color:var(--accent); border-color:var(--accent-line);}
  .rtext a, .step-main a, .step-sub a, .note-line a, .tile-desc a, .detail-context a{color:var(--info); text-decoration:underline;}
  .step-img-wrap{display:flex; align-items:flex-start; gap:8px; margin-top:6px; flex-wrap:wrap;}
  .step-img-row{display:flex; align-items:flex-start; gap:8px; margin-top:6px; flex-wrap:wrap;}
  .step-img-item{position:relative; display:inline-block;}
  .step-img-item .img-remove-btn{position:absolute; top:2px; right:2px; padding:2px 6px; font-size:10px; line-height:1.4; border-radius:3px;}
  .img-add-more{width:96px; height:96px; box-sizing:border-box;}
  .img-add-more-target{display:flex; flex-direction:column; align-items:center; justify-content:center; width:100%; height:100%; border:1px dashed var(--border); border-radius:6px; background:var(--panel-alt2); font-size:11px; text-align:center; line-height:1.4;}
  .img-add-btn{cursor:pointer; font-size:11px; padding:6px 10px; background:var(--panel-alt2);}
  .img-drop-zone{display:flex; align-items:center; gap:10px; flex-wrap:wrap; background:var(--panel-alt2); border:1px dashed var(--border); border-radius:6px; padding:8px 12px;}
  .img-placeholder{display:flex; align-items:center; gap:10px; background:var(--panel-alt2); border:1px dashed var(--border); border-radius:6px; padding:10px 14px; max-width:320px;}
  .img-placeholder-icon{font-size:20px; opacity:.6; line-height:1;}
  .img-placeholder-text{font-size:12px; color:var(--muted); line-height:1.4;}
  .img-paste-target{font-size:12px; color:var(--muted); cursor:pointer; padding:4px 8px; border-radius:4px; border:1px solid transparent; outline:none;}
  .img-paste-target:hover{color:var(--text); border-color:var(--border);}
  .img-paste-target:focus{color:var(--accent); border-color:var(--accent-line); background:var(--accent-dim);}
  .add-step-target{font-size:12px; color:var(--muted); cursor:pointer; padding:4px 8px; border-radius:4px; border:1px solid transparent; outline:none;}
  .add-step-target:hover{color:var(--text); border-color:var(--border);}
  .add-step-target:focus{color:var(--accent); border-color:var(--accent-line); background:var(--accent-dim);}
  .img-upload-link{font-size:11px; color:var(--info); cursor:pointer; text-decoration:underline; white-space:nowrap;}
  .img-upload-link:hover{color:var(--text);}
  .step-del{margin-left:8px; font-size:10px; color:var(--muted-2); cursor:pointer;}
  .step-del:hover{color:var(--fail);}
  .add-step-btn{display:inline-block; margin-top:8px; font-size:12px;}
  .add-reply-btn{display:inline-block; margin-top:8px; margin-left:8px; font-size:12px;}
  .caption-del{margin-left:8px; font-size:10px; color:var(--muted-2); cursor:pointer;}
  .caption-del:hover{color:var(--fail);}
  .add-caption-btn{display:inline-block; margin-top:4px; font-size:10px; padding:4px 9px;}
  .img-remove-btn{font-size:10px; padding:4px 8px; color:var(--fail); border-color:var(--fail-line); background:var(--fail-dim);}
  .floating-toolbar{
    display:none; position:fixed; z-index:60; top:0; left:0;
    background:var(--panel); border:1px solid var(--border); border-radius:6px;
    box-shadow:0 6px 20px rgba(0,0,0,.5); padding:4px; gap:2px;
  }
  .floating-toolbar.show{display:flex;}
  .ftbtn{
    font-family:var(--sans); font-size:12px; font-weight:600; padding:6px 10px; border-radius:4px;
    border:1px solid transparent; background:transparent; color:var(--text); cursor:pointer; white-space:nowrap;
  }
  .ftbtn:hover{background:var(--panel-alt2); border-color:var(--border);}
  .ft-size-wrap{position:relative;}
  .ft-size-menu{
    display:none; position:absolute; top:100%; left:0; margin-top:4px; z-index:70;
    background:var(--panel); border:1px solid var(--border); border-radius:6px; box-shadow:0 6px 20px rgba(0,0,0,.5);
    max-height:220px; overflow-y:auto; min-width:70px;
  }
  .ft-size-menu.show{display:block;}
  .ft-size-opt{font-family:var(--sans); font-size:12px; padding:6px 12px; color:var(--text); cursor:pointer; white-space:nowrap;}
  .ft-color-menu{padding:10px; min-width:0;}
  .ft-color-grid{display:grid; grid-template-columns:repeat(5, 22px); gap:6px; margin-bottom:8px;}
  .ft-color-swatch{width:22px; height:22px; border-radius:5px; cursor:pointer; border:1px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--muted-2);}
  .ft-color-swatch:hover{transform:scale(1.12);}
  #ftColorCustom{width:100%; height:26px; border:none; background:transparent; cursor:pointer; padding:0;}
  .ft-size-opt:hover{background:var(--panel-alt2);}
  .ft-size-opt.active{background:var(--accent-dim); color:var(--accent); font-weight:700;}
  .ft-size-all{display:flex; align-items:center; gap:6px; font-size:11px; color:var(--muted); padding:7px 10px; border-bottom:1px solid var(--border-soft); cursor:pointer; white-space:nowrap;}

  .modal-overlay{display:none; position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:200; align-items:center; justify-content:center;}
  .modal-overlay.show{display:flex;}
  .modal-box{background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:18px; width:320px; box-shadow:0 12px 40px rgba(0,0,0,.5);}
  .modal-title{font-size:14px; font-weight:600; margin-bottom:6px;}
  .modal-hint{font-size:12px; color:var(--muted); margin-bottom:10px; white-space:pre-wrap;}
  .modal-input{width:100%; background:var(--panel-alt); border:1px solid var(--border); border-radius:5px; color:var(--text); padding:8px 10px; font-size:13px; margin-bottom:14px;}
  .modal-textarea{min-height:120px; resize:vertical; font-family:var(--sans); line-height:1.5;}
  .modal-input:focus{outline:none; border-color:var(--accent);}
  .modal-actions{display:flex; justify-content:flex-end; gap:8px;}
  .modal-chips{display:none; flex-wrap:wrap; gap:6px; margin-bottom:12px;}
  .modal-chip{font-family:var(--sans); font-size:12px; border:1px solid var(--border); border-radius:12px; padding:4px 11px; cursor:pointer;}
  .modal-chip-del{margin-left:6px; opacity:.6; cursor:pointer;}
  .modal-chip-edit{margin-left:6px; opacity:.6; cursor:pointer;}
  .modal-chip-edit:hover{opacity:1;}
  .modal-chip-del:hover{opacity:1;}
  .modal-chip:hover{filter:brightness(1.3);}
  .modal-or{font-size:10px; color:var(--muted-2); margin-bottom:6px;}
  .extra-row{display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; padding-top:10px; border-top:1px dashed var(--border-soft); align-items:center;}
  .extra-btn{font-size:12px;}
  .extra-del{margin-left:6px; color:var(--muted-2); cursor:pointer;}
  .extra-del:hover{color:var(--fail);}
  .extra-restore, .extra-add{display:inline-flex; align-items:center; font-size:11.5px; padding:6px 10px; border-radius:4px; border:1px dashed var(--border); color:var(--muted-2); cursor:pointer; background:transparent;}
  .extra-add:hover, .extra-restore:hover{color:var(--accent); border-color:var(--accent-line);}
  .extra-panel{width:100%; margin-top:8px;}

  .calcbox{background:var(--panel-alt); border:1px solid var(--border); border-radius:var(--radius); padding:10px 12px; margin-top:8px; max-width:360px;}
  .calc-formula{font-family:var(--sans); font-size:10px; color:var(--muted-2); margin-bottom:8px;}
  .calc-row{display:flex; align-items:center; gap:8px; margin-bottom:6px;}

  getExtraSteps(wf.id).forEach(s=>parts.push(stepToText(s)));
  getExtraReplies(wf.id).forEach(r=>parts.push(r.label, r.tmpl));
  if(wf.reply) parts.push(wf.reply);
  if(wf.note) parts.push(wf.note);
  if(wf.extra) wf.extra.forEach(e=>parts.push(e.label, e.tmpl));
  if(wf.extraChips) parts.push(wf.extraChips.label, ...wf.extraChips.items);
  getExtraOpts(wf.id+'.chipsExtra').forEach(c=>parts.push(c));
  if(wf.detailsTable) wf.detailsTable.rows.forEach(r=>parts.push(r[0], r[1]));
  getExtraOpts(wf.id+'.tableExtraRows').forEach(r=>parts.push(r[0], r[1]));
  if(wf.sections){
    wf.sections.forEach((sec,i)=>{
      if(sec.kind==='rules'){
        sec.items.forEach(it=>parts.push(it.title, it.body));
        getExtraOpts(wf.id+'.sec'+i+'.extraRules').forEach(it=>parts.push(it.title, it.body));
      } else if(sec.kind==='template'){ parts.push(sec.text); }
      else if(sec.kind==='text'){ parts.push(sec.heading, sec.body); }
    });
    getExtraOpts(wf.id+'.extraSections').forEach(sec=>{
      if(sec.kind==='text') parts.push(sec.heading, sec.body);
    });
  }
  return stripHtml(parts.filter(Boolean).join(' ')).toLowerCase();
}
function getAllCatsRaw(){
  // gather every workflow with the category it originally belongs to, then
  // resolve its EFFECTIVE category (an override set by dragging its tile onto
  // a different tab), so a workflow can be moved between folders freely.
  const allWithOrigin = [];
  CATS.forEach(c=>{
    c.workflows.forEach(w=> allWithOrigin.push({wf:w, origCatId:c.id}));
    getExtraWorkflows(c.id).forEach(w=> allWithOrigin.push({wf:w, origCatId:c.id}));
  });
  getExtraCats().forEach(c=>{
    getExtraWorkflows(c.id).forEach(w=> allWithOrigin.push({wf:w, origCatId:c.id}));
  });
  function effectiveCatId(item){
    const ec = ov(item.wf.id+'.category', item.origCatId);
    const knownCatIds = new Set([...CATS.map(c=>c.id), ...getExtraCats().map(c=>c.id)]);
    return knownCatIds.has(ec) ? ec : item.origCatId;
  }
  const builtins = CATS.map(c=>({ id:c.id, name:c.name, workflows: allWithOrigin.filter(item=>effectiveCatId(item)===c.id).map(item=>item.wf) }));
  const extra = getExtraCats().map(c=>({ id:c.id, name:c.name, workflows: allWithOrigin.filter(item=>effectiveCatId(item)===c.id).map(item=>item.wf), extra:true }));
  return [...builtins, ...extra];
}
function getCatTabOrder(){
  const all = getAllCatsRaw().filter(c => !(!c.extra && ov('cat:'+c.id+'.hidden', null)==='1'));
  const ids = all.map(c=>c.id);
  const stored = state.overrides['__global.catOrder'];
  if(!stored || !Array.isArray(stored)) return all;
  const orderedIds = stored.filter(id=>ids.includes(id));
  const missing = ids.filter(id=>!orderedIds.includes(id));
  const finalIds = [...orderedIds, ...missing];
  return finalIds.map(id=>all.find(c=>c.id===id)).filter(Boolean);
}
function getHiddenBuiltinCats(){
  return CATS.filter(c => ov('cat:'+c.id+'.hidden', null)==='1');
}

/* ---- undo/redo (coarse-grained: snapshots the whole overrides object) ---- */
let undoStack = [];
let redoStack = [];
let tileDragSrcId = null; // shared across renderGrid (tile drag source) and renderTabs (drop target for cross-category move)
function snapshotUndo(){
  try{ undoStack.push(JSON.stringify(state.overrides)); if(undoStack.length>50) undoStack.shift(); redoStack = []; }catch(e){}
}
function performUndo(){
  if(!undoStack.length) return;
  const prev = undoStack.pop();
  try{ redoStack.push(JSON.stringify(state.overrides)); if(redoStack.length>50) redoStack.shift(); state.overrides = JSON.parse(prev); }catch(e){ return; }
  persist();
  applySubtitleSize();
  renderTabs();
  renderStage();
}
function performRedo(){
  if(!redoStack.length) return;
  const next = redoStack.pop();
  try{ undoStack.push(JSON.stringify(state.overrides)); if(undoStack.length>50) undoStack.shift(); state.overrides = JSON.parse(next); }catch(e){ return; }
  persist();
  applySubtitleSize();
  renderTabs();
  renderStage();
}
document.addEventListener('focusin', (e)=>{
  const el = e.target;
  if(el && el.getAttribute && el.getAttribute('contenteditable')==='true' && !el.dataset.snapped){
    snapshotUndo();
    el.dataset.snapped = '1';
  }
});
document.addEventListener('focusout', (e)=>{
  const el = e.target;
  if(el && el.dataset) delete el.dataset.snapped;
});
/* auto-scroll the page while dragging anything near the top/bottom edge of
   the viewport — without this, reordering steps or reply templates further
   than one screen apart means the list never scrolls, so the far target is
   simply unreachable. Registered once at capture phase so it still sees the
   pointer position even though the per-item drag handlers (steps, pills,
   tags, tabs, tiles, extra-btn) call stopPropagation() on their own
   dragover — capture fires before that, so this keeps working everywhere. */
(function(){
  const EDGE_ZONE = 90, MAX_SPEED = 22;
  let speed = 0, raf = null;
  function tick(){
    if(speed !== 0){ window.scrollBy(0, speed); raf = requestAnimationFrame(tick); }
    else raf = null;
  }
  document.addEventListener('dragover', (e)=>{
    const y = e.clientY, h = window.innerHeight;
    if(y < EDGE_ZONE) speed = -MAX_SPEED * (1 - y/EDGE_ZONE);
    else if(y > h - EDGE_ZONE) speed = MAX_SPEED * (1 - (h-y)/EDGE_ZONE);
    else speed = 0;
    if(speed !== 0 && !raf) raf = requestAnimationFrame(tick);
  }, true);
  document.addEventListener('dragend', ()=>{ speed = 0; }, true);
  document.addEventListener('drop', ()=>{ speed = 0; }, true);
})();
document.addEventListener('keydown', (e)=>{
  if(!state.editMode) return;
  const k = e.key.toLowerCase();
  if((e.ctrlKey || e.metaKey) && k==='z' && e.shiftKey){
    e.preventDefault();
    performRedo();
    return;
  }
  if((e.ctrlKey || e.metaKey) && k==='y'){
    e.preventDefault();
    performRedo();
    return;
  }
  if((e.ctrlKey || e.metaKey) && k==='z'){
    e.preventDefault();
    performUndo();
  }
});

let TMPL_REGISTRY = [];
function slugify(str){ return str.replace(/[^a-zA-Z0-9]/g,'_'); }
function splitBilingual(text){
  const parts = text.split(/\n-{3,}\n/);
  if(parts.length!==2) return null;
  const hasCJK = s => /[\u3400-\u9fff]/.test(s);
  if(hasCJK(parts[0]) && !hasCJK(parts[1])) return {zh:parts[0], en:parts[1]};
  if(hasCJK(parts[1]) && !hasCJK(parts[0])) return {zh:parts[1], en:parts[0]};
  return {zh:parts[0], en:parts[1]};
}
function tmplBox(rawText, ovKeyBase, opts){
  opts = opts||{};
  const removed = ov(ovKeyBase+'.boxRemoved', null)==='1';
  if(removed) return '';
  const idx = TMPL_REGISTRY.length;
  TMPL_REGISTRY.push({rawText, ovKeyBase, internal: !!opts.internal});
  const delHtml = state.editMode ? `<span class="tmplbox-del" data-ovkeybase="${ovKeyBase}" title="移除这个模板">✕</span>` : '';
  return `<div class="tmplbox-wrap" data-idx="${idx}">
    <div class="tmplbox-head">
      <span class="tmpl-label">${edText(ovKeyBase+'.label', opts.label||'回覆模板')}</span>

}

function renderExtras(extras, ovKeyBase){
  const schemaLen = extras ? extras.length : 0;
  const extraChips = getExtraOpts(ovKeyBase+'.extraChips');
  const list = (extras||[]).concat(extraChips);
  if(!list.length && !state.editMode) return '';
  const orderKey = ovKeyBase+'.extraOrder';
  const order = getOptOrder(orderKey, list.length);
  let hiddenCount = 0;
  const dragAttrs = (i) => state.editMode ? ` draggable="true" data-orderkey="${orderKey}" data-origidx="${i}" data-totallen="${list.length}"` : '';
  const btns = order.map(i=>{
    const e = list[i];
    if(!e) return '';
    if(i < schemaLen && ov(ovKeyBase+'.rchip'+i+'.hidden', null)==='1'){ hiddenCount++; return ''; }
    const delHtml = state.editMode ? `<span class="extra-del" data-idx="${i}" data-ovkeybase="${ovKeyBase}" data-schemalen="${schemaLen}" title="删除">✕</span>` : '';
    return `<button class="btn extra-btn"${dragAttrs(i)} data-extra="${ovKeyBase}__x${i}">${edText(ovKeyBase+'.rchip'+i+'.label', e.label)}${delHtml}</button>`;
  }).join('');
  const panels = order.map(i=>{
    const e = list[i];
    if(!e) return '';
    if(i < schemaLen && ov(ovKeyBase+'.rchip'+i+'.hidden', null)==='1') return '';
    return `<div class="extra-panel" data-for="${ovKeyBase}__x${i}" style="display:none;">${tmplBox(e.tmpl||'', ovKeyBase+'.rchip'+i, {label: e.label})}</div>`;
  }).join('');
  const restoreHtml = (hiddenCount && state.editMode) ? `<span class="extra-restore" data-ovkeybase="${ovKeyBase}" data-schemalen="${schemaLen}">↺ 还原 ${hiddenCount}</span>` : '';
  const addHtml = state.editMode ? `<span class="extra-add" data-ovkeybase="${ovKeyBase}">+ 新增</span>` : '';
  return `<div class="extra-row">${btns}${restoreHtml}${addHtml}</div>${panels}`;
}

function findWF(id){ for(const c of getAllCatsRaw()){ const w=c.workflows.find(w=>w.id===id); if(w) return {cat:c, wf:w}; } return null; }

/* =========================================================
   RENDER: tabs
========================================================= */
function renderTabs(){
  const tabs=document.getElementById('tabs'); tabs.innerHTML='';
  const cats = getCatTabOrder();
  let dragSrcId = null;
  cats.forEach(c=>{
    const t=document.createElement('div');
    t.className='tab'+(c.id===state.activeCat && !state.activeWF ? ' active':'');
    t.setAttribute('data-cat-id', c.id);
    t.innerHTML = esc(c.name) + (state.editMode ? ` <span class="tab-del" data-cat-id="${c.id}" data-cat-extra="${c.extra?'1':'0'}">✕</span>` : '');
    t.onclick=(e)=>{ if(e.target.closest('.tab-del')) return; state.activeCat=c.id; state.activeWF=null; state.query=''; document.getElementById('searchInput').value=''; renderTabs(); renderStage(); };
    if(state.editMode){
      t.draggable = true;
      t.classList.add('tab-draggable');
      t.addEventListener('dragstart', ()=>{ dragSrcId = c.id; t.classList.add('dragging'); });
      t.addEventListener('dragend', ()=>{ t.classList.remove('dragging'); });
      t.addEventListener('dragover', (e)=>{ e.preventDefault(); if(tileDragSrcId) t.classList.add('tab-drop-target'); });
      t.addEventListener('dragleave', ()=>{ t.classList.remove('tab-drop-target'); });
      t.addEventListener('drop', (e)=>{
        e.preventDefault();
        t.classList.remove('tab-drop-target');
        if(tileDragSrcId){
          const wfId = tileDragSrcId;
          tileDragSrcId = null;
          const found = findWF(wfId);
          if(!found || found.cat.id===c.id) return;
          snapshotUndo();
          state.overrides[wfId+'.category'] = c.id;
          persist();
          renderTabs();
          renderStage();
          return;
        }
        if(!dragSrcId || dragSrcId===c.id) return;
        snapshotUndo();
        const ids = cats.map(x=>x.id);
        const from = ids.indexOf(dragSrcId), to = ids.indexOf(c.id);
        ids.splice(from,1); ids.splice(to,0,dragSrcId);
        state.overrides['__global.catOrder'] = ids;
        persist();
        renderTabs();
      });
    }
    tabs.appendChild(t);
  });
  tabs.querySelectorAll('.tab-del').forEach(btn=>{
    btn.onclick=(e)=>{
      e.stopPropagation();
      const catId = btn.getAttribute('data-cat-id');
      const isExtra = btn.getAttribute('data-cat-extra')==='1';
      showConfirmModal('删除这个分类？', isExtra ? '里面的工作流程也会一起删除。' : '内建分类会先隐藏，可以在「新增分类」旁边还原。', ()=>{
        snapshotUndo();
        if(isExtra){
          const removedWfIds = getExtraWorkflows(catId).map(w=>w.id);
          const extra = getExtraCats().filter(c=>c.id!==catId);
          state.overrides['__global.extraCats'] = extra;
          delete state.overrides['__global.extraWorkflows.'+catId];
          delete state.overrides['cat:'+catId+'.order'];
          removedWfIds.forEach(id=>purgeOverridesByPrefix(id));
        } else {
          state.overrides['cat:'+catId+'.hidden'] = '1';
        }
        persist();
        if(state.activeCat===catId){ state.activeCat = CATS[0].id; state.activeWF=null; }
        renderTabs(); renderStage();
      });
    };
  });
  if(state.editMode){
    const addTab = document.createElement('div');
    addTab.className = 'tab tab-add';
    addTab.textContent = '+ 新增分类';
    addTab.onclick = ()=>{
      showInputModal('新增分类', '', '', (name)=>{
        if(!name) return;
        snapshotUndo();
        const id = 'cat_'+Date.now();
        const extra = getExtraCats();
        extra.push({id, name});
        state.overrides['__global.extraCats'] = extra;
        persist();
        state.activeCat = id; state.activeWF = null;
        renderTabs(); renderStage();
      });
    };
    tabs.appendChild(addTab);
    const hiddenCats = getHiddenBuiltinCats();
    if(hiddenCats.length){
      const restoreTab = document.createElement('div');
      restoreTab.className = 'tab tab-restore';
      restoreTab.textContent = `↺ 还原 ${hiddenCats.length} 个分类`;
      restoreTab.onclick = ()=>{
        snapshotUndo();
        hiddenCats.forEach(c=> delete state.overrides['cat:'+c.id+'.hidden']);
        persist();
        renderTabs(); renderStage();
      };
      tabs.appendChild(restoreTab);
    }
  }
}

function getCatOrder(cat){
  const key = 'cat:'+cat.id+'.order';
  const ids = cat.workflows.map(w=>w.id);
  const stored = state.overrides[key];
  if(!stored || !Array.isArray(stored)) return ids;
  const ordered = stored.filter(id=>ids.includes(id));
  const missing = ids.filter(id=>!ordered.includes(id));
  return [...ordered, ...missing];
}
const KIND_COLORS = ['#3ED9A6','#5B9DF9','#34D399','#F2545B','#F5A524','#C084FC'];
function getTmplPalette(){
  const raw = state.overrides['__global.tmplPalette'] || [];
  const clean = raw.filter(t => t && t.label && t.tmpl && !/<[^>]*>/.test(t.label) && t.label.trim().length);
  if(clean.length !== raw.length){
    state.overrides['__global.tmplPalette'] = clean;
    persist();
  }
  return clean;
}
function addToTmplPalette(label, tmpl){
  if(!label || !tmpl) return;
  const palette = getTmplPalette();
  if(palette.some(t=>t.label.toLowerCase()===label.toLowerCase())) return;
  palette.push({label, tmpl});
  state.overrides['__global.tmplPalette'] = palette;
  persist();
}
function getPalette(){
  const raw = state.overrides['__global.tagPalette'] || [];
  const clean = raw.filter(t => t && t.name && !/<[^>]*>/.test(t.name) && t.name.trim().length);
  if(clean.length !== raw.length){
    state.overrides['__global.tagPalette'] = clean;
    persist();
  }
  return clean;
}
function getTagColor(name){
  name = stripHtml(name);
  const palette = getPalette();
  const found = palette.find(t=>t.name.toLowerCase()===String(name).toLowerCase());
  if(found) return found.color;
  const color = KIND_COLORS[palette.length % KIND_COLORS.length];
  palette.push({name, color});
  state.overrides['__global.tagPalette'] = palette;
  persist();
  return color;
}
function cycleTagColor(name){
  const palette = getPalette();
  const found = palette.find(t=>t.name.toLowerCase()===String(name).toLowerCase());
  if(!found) return;
  const idx = KIND_COLORS.indexOf(found.color);
  found.color = KIND_COLORS[(idx+1) % KIND_COLORS.length];
  state.overrides['__global.tagPalette'] = palette;
  persist();
}
function stripHtml(s){ return String(s).replace(/<[^>]+>/g,'').trim(); }
function getTileTags(wf){
  const stored = state.overrides[wf.id+'.tags'];
  if(stored) return stored;
  const legacyText = state.overrides[wf.id+'.kindText'];
  return [ legacyText !== undefined ? stripHtml(legacyText) : wf.kind ];
}
function setTileTags(wfId, tags){ state.overrides[wfId+'.tags'] = tags; }
function isWfHidden(wfId){ return ov(wfId+'.hidden', null)==='1'; }
function isWfPurged(wfId){ return ov(wfId+'.purged', null)==='1'; }
function renderGrid(){
  const stage=document.getElementById('stage');

  const allCats = getAllCatsRaw();
  if(state.query){
    const q=state.query.toLowerCase();
    allCats.forEach(c=> c.workflows.forEach(w=>{

    }
  }
  const draggable = state.editMode && !state.query;
  const activeCatObj = allCats.find(c=>c.id===state.activeCat);
  const canAddWF = state.editMode && !state.query && activeCatObj;
  if(!workflows.length && !canAddWF){
    stage.innerHTML=`<div style="color:var(--muted-2); padding:50px 0; text-align:center; font-size:13px;">没有符合的工作流程</div>`;
    return;
  }
  const tilesHtml = workflows.map(({cat,wf})=>{
    const tags = getTileTags(wf);
    const isCustomWf = String(wf.id).indexOf('wf_')===0;
    return `
    <div class="tile${draggable?' draggable':''}" data-id="${wf.id}"${draggable?' draggable="true"':''}>
      ${state.query ? `<span class="search-tag">${cat.name}</span>` : ''}
      ${(draggable || state.editMode) ? `<div class="tile-actions">
        ${state.editMode ? `<span class="tile-del-wf" draggable="false" data-wf="${wf.id}" data-cat="${cat.id}" data-custom="${isCustomWf?'1':'0'}" title="封存这个工作流程">🗄</span>` : ''}
        ${draggable?'<span class="drag-handle">⠿</span>':''}
      </div>` : ''}
      <div class="tile-kind-row">
        ${tags.map((name,i)=>{ const color = getTagColor(name); return `<span class="tag-pill"${state.editMode?' draggable="true"':''} data-wf="${wf.id}" data-idx="${i}" style="color:${color}; border-color:${color}">${esc(name)}${state.editMode?`<span class="tag-del" draggable="false" data-wf="${wf.id}" data-idx="${i}">×</span>`:''}</span>`; }).join('')}
        ${state.editMode ? `<span class="tag-add" draggable="false" data-wf="${wf.id}">+ 标签</span>` : ''}
      </div>
      <div class="tile-title"${ov(wf.id+'.tileTitleSize',null)?` style="font-size:${ov(wf.id+'.tileTitleSize',null)}px;"`:''}>${edText(wf.id+'.title', wf.title)}</div>
      <div class="tile-desc">${edText(wf.id+'.context', wf.context)}</div>
    </div>`;
  }).join('');
  const addTileHtml = canAddWF ? `<div class="tile tile-add" id="addWfTile">＋ 新增工作流程</div>` : '';
  stage.innerHTML = `<div class="grid">${tilesHtml}${addTileHtml}</div>`;

  if(canAddWF){
    document.getElementById('addWfTile').onclick = ()=>{
      showInputModal('新增工作流程', '', '', (title)=>{
        if(!title) return;
        snapshotUndo();
        const id = 'wf_'+Date.now();
        const list = getExtraWorkflows(activeCatObj.id);
        list.push({ id, title, kind:'清单', type:'checklist', context:'', steps:['（点击这段文字开始编辑）'] });
        state.overrides['__global.extraWorkflows.'+activeCatObj.id] = list;
        persist();
        renderGrid();
      });
    };
  }
  let tagDragSrc = null;
  stage.querySelectorAll('.tag-add').forEach(btn=>{
    btn.onclick=(e)=>{
      e.stopPropagation();
      showTagPickerModal((text)=>{
        if(!text) return;
        snapshotUndo();
        const wfId = btn.getAttribute('data-wf');
        const wf = findWF(wfId).wf;
        const tags = getTileTags(wf).slice();
        if(tags.some(t=>t.toLowerCase()===text.toLowerCase())) return;
        tags.push(text);
        setTileTags(wfId, tags);
        persist();
        renderGrid();
      });
    };
  });
  stage.querySelectorAll('.tag-del').forEach(btn=>{
    btn.onclick=(e)=>{
      e.stopPropagation();
      snapshotUndo();
      const wfId = btn.getAttribute('data-wf'), idx = parseInt(btn.getAttribute('data-idx'));
      const wf = findWF(wfId).wf;
      const tags = getTileTags(wf).slice();
      tags.splice(idx,1);
      setTileTags(wfId, tags);
      persist();
      renderGrid();
    };
  });
  stage.querySelectorAll('.tag-pill').forEach(pill=>{
    pill.onclick=(e)=>{
      if(e.target.closest('.tag-del')) return;
      if(!state.editMode) return;
      if(pill.dataset.wasDragged==='1'){ pill.dataset.wasDragged='0'; return; }
      e.stopPropagation();
      snapshotUndo();
      const wfId = pill.getAttribute('data-wf'), idx = parseInt(pill.getAttribute('data-idx'));
      const wf = findWF(wfId).wf;
      const tags = getTileTags(wf);
      cycleTagColor(tags[idx]);
      renderGrid();
    };
    if(state.editMode){
      pill.addEventListener('dragstart', (e)=>{
        e.stopPropagation();
        tagDragSrc = { wf: pill.getAttribute('data-wf'), idx: parseInt(pill.getAttribute('data-idx')) };
        pill.classList.add('dragging');
      });
      pill.addEventListener('dragend', ()=>{ pill.classList.remove('dragging'); });
      pill.addEventListener('dragover', (e)=>{
        if(tagDragSrc && tagDragSrc.wf===pill.getAttribute('data-wf')){ e.preventDefault(); e.stopPropagation(); }
      });
      pill.addEventListener('drop', (e)=>{
        const wfId = pill.getAttribute('data-wf');
        if(!tagDragSrc || tagDragSrc.wf!==wfId) return;
        e.preventDefault(); e.stopPropagation();
        const toIdx = parseInt(pill.getAttribute('data-idx'));
        if(toIdx===tagDragSrc.idx) return;
        snapshotUndo();
        const wf = findWF(wfId).wf;
        const tags = getTileTags(wf).slice();
        const [moved] = tags.splice(tagDragSrc.idx, 1);
        tags.splice(toIdx, 0, moved);
        setTileTags(wfId, tags);
        persist();
        pill.dataset.wasDragged='1';
        renderGrid();
      });
    }
  });
  stage.querySelectorAll('.tile-del-wf').forEach(btn=>{
    btn.onclick=(e)=>{
      e.stopPropagation();
      showConfirmModal('封存这个工作流程？', '会先移到「封存区」，内容都会保留，之后可以还原或永久删除。', ()=>{
        snapshotUndo();
        const wfId = btn.getAttribute('data-wf');
        state.overrides[wfId+'.hidden'] = '1';
        persist();
        renderGrid();
      });
    };
  });
  stage.querySelectorAll('.tile[data-id]').forEach(t=>{
    t.onclick=(e)=>{ if(e.target.closest('[contenteditable="true"]') || e.target.closest('.tag-pill') || e.target.closest('.tag-add') || e.target.closest('.tile-del-wf')) return; const id=t.getAttribute('data-id'); const found=findWF(id); state.activeCat=found.cat.id; state.activeWF=id; state.path=[0,0,0]; renderTabs(); renderStage(); };
    if(draggable){
      t.addEventListener('dragstart', (e)=>{ tileDragSrcId = t.getAttribute('data-id'); t.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; });
      t.addEventListener('dragend', ()=>{ t.classList.remove('dragging'); tileDragSrcId = null; });
      t.addEventListener('dragover', (e)=>{ e.preventDefault(); });
      t.addEventListener('drop', (e)=>{
        e.preventDefault();
        const targetId = t.getAttribute('data-id');
        if(!tileDragSrcId || tileDragSrcId===targetId) return;
        const cat = allCats.find(c=>c.id===state.activeCat);
        snapshotUndo();
        const key = 'cat:'+cat.id+'.order';
        let order = getCatOrder(cat);
        const from = order.indexOf(tileDragSrcId), to = order.indexOf(targetId);
        if(from<0 || to<0) return;
        order.splice(from,1); order.splice(to,0,tileDragSrcId);
        state.overrides[key]=order; persist();
        renderGrid();
      });
    }
  });
  stage.querySelectorAll('[contenteditable="true"]').forEach(node=>{
    node.addEventListener('input', ()=> persistEditable(node));
  });
}

window.toggleTmplVariant = function(event, btn){
  if(event) event.stopPropagation();
  if(event && event.target.closest('.pill-del')) return;
  const group = btn.getAttribute('data-group');
  const idx = btn.getAttribute('data-idx');
  document.querySelectorAll(`[data-group="${group}"]`).forEach(el=>{
    if(el.classList.contains('tmpl-toggle-btn')){
      el.classList.toggle('sel', el.getAttribute('data-idx')===idx);
    } else {
      el.style.display = (el.getAttribute('data-idx')===idx) ? '' : 'none';
    }
  });
};
function copyText(btn, text){
  navigator.clipboard && navigator.clipboard.writeText(text).then(()=>{
    const old=btn.textContent;
    btn.textContent='✓'; btn.classList.add('copied');
    setTimeout(()=>{ btn.textContent=old; btn.classList.remove('copied'); }, 1300);
  });
}

let CALC_COUNTER = 0;
function renderCalc(kind){
  kind = kind || 'fixscore';
  const idx = CALC_COUNTER++;
  if(kind==='divide'){
    return `<div class="calcbox" data-calc="${idx}" data-kind="divide">
      <div class="calc-formula">USDT amount = Amount ÷ Rate</div>
      <div class="calc-row"><label>Amount</label><input type="number" class="calc-a" step="any" placeholder="例如 68100"></div>
      <div class="calc-row"><label>Rate</label><input type="number" class="calc-b" step="any" placeholder="例如 6.78"></div>
      <div class="calc-result">USDT amount：<span class="calc-out">—</span><button class="copy-btn calc-copy" disabled>拷贝数字</button></div>
      <div class="calc-remark"><span class="calc-remark-text"></span><button class="copy-btn calc-copy-remark">拷贝 Remark</button></div>
    </div>`;
  }
  if(kind==='intervaltool'){
    return renderIntervalToolHtml('itoolcalc'+idx);
  }
  if(kind==='clientrate'){
    return `<div class="calcbox" data-calc="${idx}" data-kind="clientrate">
      <div class="calc-formula">Client Exchange Rate：依 Merchant 对应的 Profit Margin + Action 计算（Margin &gt; 1 = 倍率、≤ 1 = 加减价差；VND / IDR 取整数，其他取 2 位小数；Withdraw + INR / INR-N / VND / CNY 一律改看 self-service bot rate）</div>
      <div class="calc-row"><label>Merchant</label>
        <div class="calc-autocomplete">
          <input type="text" class="calc-merchant" autocomplete="off" placeholder="输入商户名搜寻…">
          <div class="calc-merchant-list"></div>
        </div>
      </div>
      <div class="calc-row calc-merchant-sub" style="display:none;"><label>PSP / Currency</label>
        <select class="calc-merchant-sub-select"></select>
      </div>
      <div class="calc-row"><label>Action</label>
        <select class="calc-action">
          <option value="Withdraw">Withdraw</option>
          <option value="Top up">Top up</option>
        </select>
      </div>
      <div class="calc-row"><label>3rd Exchange Rate</label><input type="number" class="calc-a" step="any" placeholder="请输入当下汇率"></div>
      <div class="calc-row calc-readout"><label>查到的资料</label><span class="calc-lookup-info">—</span></div>
      <div class="calc-result">Client Exchange Rate：<span class="calc-out">—</span><button class="copy-btn calc-copy" disabled>拷贝数字</button></div>
    </div>`;
  }
  return `<div class="calcbox" data-calc="${idx}" data-kind="fixscore">
    <div class="calc-formula">Fix score amount = Actual amount × (1 − Service Rate × 0.01)</div>
    <div class="calc-row"><label>Actual amount</label><input type="number" class="calc-a" step="any" placeholder="例如 2500"></div>
    <div class="calc-row"><label>Service Rate（%）</label><input type="number" class="calc-b" step="any" placeholder="例如 3.9"></div>
    <div class="calc-result">Fix score amount：<span class="calc-out">—</span><button class="copy-btn calc-copy" disabled>拷贝数字</button></div>
    <div class="calc-remark"><span class="calc-remark-text"></span><button class="copy-btn calc-copy-remark">拷贝 Remark</button></div>
  </div>`;
}
function wireCalcBoxes(container){
  container.querySelectorAll('.calcbox[data-kind="clientrate"]').forEach(box=>{
    const merchantEl = box.querySelector('.calc-merchant');
    const listEl = box.querySelector('.calc-merchant-list');
    const subRow = box.querySelector('.calc-merchant-sub');
    const subEl = box.querySelector('.calc-merchant-sub-select');
    const actionEl = box.querySelector('.calc-action');
    const aEl = box.querySelector('.calc-a');
    const infoEl = box.querySelector('.calc-lookup-info');
    const outEl = box.querySelector('.calc-out');
    const copyBtn = box.querySelector('.calc-copy');

    const uniqueMerchants = [...new Set(CLIENT_TABLE.map(r=>r.m))];
    let hlIndex = -1;

    function setHighlight(i){
      const opts = listEl.querySelectorAll('.calc-merchant-opt');
      opts.forEach(o=>o.classList.remove('hl'));
      if(opts[i]){ opts[i].classList.add('hl'); if(opts[i].scrollIntoView) opts[i].scrollIntoView({block:'nearest'}); }
      hlIndex = i;
    }
    function renderList(filterText){
      const q = (filterText||'').trim().toLowerCase();
      const matches = q ? uniqueMerchants.filter(m=>m.toLowerCase().includes(q)) : uniqueMerchants;
      listEl.innerHTML = '';
      if(matches.length===0){
        const empty = document.createElement('div');
        empty.className = 'calc-merchant-empty';
        empty.textContent = '没有符合的 Merchant';
        listEl.appendChild(empty);
      } else {
        matches.slice(0,200).forEach(m=>{
          const opt = document.createElement('div');
          opt.className = 'calc-merchant-opt';
          opt.textContent = m;
          opt.dataset.value = m;
          listEl.appendChild(opt);
        });
      }
      hlIndex = -1;
      listEl.classList.add('show');
    }
    function hideList(){ listEl.classList.remove('show'); }
    function selectMerchant(name){
      merchantEl.value = name;
      hideList();
      refreshSub();
    }

    merchantEl.addEventListener('focus', ()=> renderList(merchantEl.value));
    merchantEl.addEventListener('input', ()=>{ renderList(merchantEl.value); refreshSub(); });
    merchantEl.addEventListener('keydown', (e)=>{
      const opts = listEl.querySelectorAll('.calc-merchant-opt');
      if(e.key==='ArrowDown'){ e.preventDefault(); setHighlight(Math.min(hlIndex+1, opts.length-1)); }
      else if(e.key==='ArrowUp'){ e.preventDefault(); setHighlight(Math.max(hlIndex-1, 0)); }
      else if(e.key==='Enter'){ if(hlIndex>=0 && opts[hlIndex]){ e.preventDefault(); selectMerchant(opts[hlIndex].dataset.value); } }
      else if(e.key==='Escape'){ hideList(); }
    });
    listEl.addEventListener('mousedown', (e)=>{
      const opt = e.target.closest('.calc-merchant-opt');
      if(!opt) return;
      e.preventDefault();
      selectMerchant(opt.dataset.value);
    });
    document.addEventListener('mousedown', (e)=>{
      if(!box.contains(e.target)) hideList();
    });

    function getMatches(){ return CLIENT_TABLE.filter(r=>r.m===merchantEl.value); }
    function currentRow(){
      const matches = getMatches();
      if(matches.length===0) return null;
      if(matches.length===1) return matches[0];
      return matches[parseInt(subEl.value)||0] || matches[0];
    }
    function recalc(){
      const row = currentRow();
      if(!row){
        infoEl.textContent = '—';
        outEl.textContent = '—'; copyBtn.disabled = true;
        return;
      }
      infoEl.textContent = `PSP: ${row.p||'—'} ／ Currency: ${row.c} ／ Margin: ${row.margin}${row.limit?' ／ Limit: '+row.limit:''}`;
      const a = parseFloat(aEl.value);
      if(isNaN(a)){ outEl.textContent='—'; copyBtn.disabled=true; return; }
      const action = actionEl.value;
      const currency = row.c;
      const margin = row.margin;
      const botRateCurrencies = ['INR-N','VND','CNY','INR'];
      if(action==='Withdraw' && botRateCurrencies.includes(currency)){
        outEl.textContent = 'refer to bot rate'; copyBtn.disabled = true; return;
      }
      const roundToInt = (currency==='VND' || currency==='IDR');
      const roundFn = v => roundToInt ? Math.round(v) : Math.round(v*100)/100;
      let result;
      if(action==='Withdraw'){ result = margin > 1 ? a*margin : a+margin; }
      else { result = margin > 1 ? a/margin : a-margin; }
      outEl.textContent = roundFn(result).toString();
      copyBtn.disabled = false;
    }
    function refreshSub(){
      const matches = getMatches();
      if(matches.length>1){
        subRow.style.display='flex';
        subEl.innerHTML='';
        matches.forEach((r,i)=>{
          const o=document.createElement('option');
          o.value=String(i);
          o.textContent = `${r.p||'—'} · ${r.c}`;
          subEl.appendChild(o);
        });
      } else {
        subRow.style.display='none';
      }
      recalc();
    }
    subEl.addEventListener('change', recalc);
    actionEl.addEventListener('change', recalc);
    aEl.addEventListener('input', recalc);
    copyBtn.addEventListener('click', ()=>{ copyText(copyBtn, outEl.textContent); });
    refreshSub();
  });
  container.querySelectorAll('.calcbox[data-kind="fixscore"], .calcbox[data-kind="divide"]').forEach(box=>{
    const kind = box.getAttribute('data-kind') || 'fixscore';
    const aEl = box.querySelector('.calc-a');
    const bEl = box.querySelector('.calc-b');
    const outEl = box.querySelector('.calc-out');
    const copyBtn = box.querySelector('.calc-copy');
    const remarkRow = box.querySelector('.calc-remark');
    const remarkText = box.querySelector('.calc-remark-text');
    const remarkCopyBtn = box.querySelector('.calc-copy-remark');
    function recalc(){
      const a = parseFloat(aEl.value);
      const b = parseFloat(bEl.value);
      if(isNaN(a) || isNaN(b) || (kind==='divide' && b===0)){
        outEl.textContent='—'; copyBtn.disabled=true; remarkRow.style.display='none'; return;
      }
      const result = kind==='divide' ? (a/b) : (a * (1 - b*0.01));
      const rounded = Math.round(result*100)/100;
      outEl.textContent = rounded.toString();
      copyBtn.disabled = false;
      const composed = kind==='divide'
        ? `order ID + ${a}/${b} = ${rounded}`
        : `order ID + ${a}×(1−${b}%) = ${rounded}`;
      remarkText.textContent = composed;
      remarkRow.style.display = 'flex';
    }
    aEl.addEventListener('input', recalc);
    bEl.addEventListener('input', recalc);
    copyBtn.addEventListener('click', ()=>{ copyText(copyBtn, outEl.textContent); });
    remarkCopyBtn.addEventListener('click', ()=>{ copyText(remarkCopyBtn, remarkText.textContent); });
  });
}

function renderRefimg(ref, keyBase){
  if(!ref) return '';
  return `<div style="margin:8px 0;">${renderStepImgBlock({img:ref.img, imgCaption:ref.caption}, keyBase)}</div>`;
}

function renderStepImgBlock(step, keyBase){
  const imgRemovedKey = keyBase+'.imgRemoved';
  const imgDataKey = keyBase+'.imgData';
  const captionKey = keyBase+'.imgCaption';
  const extraImgsKey = keyBase+'.extraImages';
  const imgRemoved = ov(imgRemovedKey, null) === '1';
  const userImgData = ov(imgDataKey, null);
  const schemaImg = step && step.img ? IMG[step.img] : null;
  const primarySrc = userImgData || (schemaImg && !imgRemoved ? schemaImg : null);
  const extraImgs = ov(extraImgsKey, null) || [];
  const parts = [];
  const hasAnyImage = !!primarySrc || extraImgs.length>0;
  // This build ships with every reference screenshot stripped out (IMG is
  // empty), so a step that originally pointed at one now has step.img set
  // but no actual bytes behind it. Rather than silently rendering nothing,
  // show a plain text/icon placeholder so the walkthrough still reads
  // correctly without shipping any real screenshot.
  const hadSchemaImg = !!(step && step.img) && !imgRemoved && !userImgData && extraImgs.length===0;

  if(hasAnyImage){
    const thumbs = [];
    if(primarySrc){
      thumbs.push(`<div class="step-img-item">
        <img class="refimg-thumb" src="${primarySrc}" data-full="${primarySrc}">
        ${state.editMode ? `<button class="btn img-remove-btn" data-imgkey="${keyBase}" title="移除这张图">✕</button>` : ''}
      </div>`);
    }
    extraImgs.forEach((src, idx)=>{
      thumbs.push(`<div class="step-img-item">
        <img class="refimg-thumb" src="${src}" data-full="${src}">
        ${state.editMode ? `<button class="btn img-remove-btn" data-extrakey="${extraImgsKey}" data-extraidx="${idx}" title="移除这张图">✕</button>` : ''}
      </div>`);
    });
    if(state.editMode){
      thumbs.push(`<div class="step-img-item img-add-more">
        <span class="img-paste-target img-add-more-target" tabindex="0" data-imgkey="${keyBase}" data-imgmode="add">＋<br>贴上／上传</span>
        <input type="file" accept="image/*" class="img-add-input" data-imgkey="${keyBase}" data-imgmode="add" style="display:none;">
      </div>`);
    }
    parts.push(`<div class="step-img-row">${thumbs.join('')}</div>`);

    const schemaCaption = step && step.imgCaption;
    const capRemoved = ov(captionKey+'.removed', null) === '1';
    const capVal = state.overrides[captionKey] !== undefined ? state.overrides[captionKey] : (schemaCaption||'');
    const capBoxVisible = !capRemoved && (state.overrides[captionKey] !== undefined || (schemaCaption && !userImgData));
    const capHasContent = stripHtml(capVal).trim().length > 0;
    if(capBoxVisible){
      parts.push(`<div class="step-sub">${edText(captionKey, schemaCaption||'')}${(state.editMode && capHasContent)?`<span class="caption-del" data-capkey="${captionKey}">✕ 移除说明</span>`:''}</div>`);
    } else if(state.editMode){
      parts.push(`<span class="btn add-caption-btn" data-capkey="${captionKey}">+ 加说明文字</span>`);
    }
  } else if(hadSchemaImg){
    const schemaCaption = step && step.imgCaption;
    parts.push(`<div class="step-img-wrap">
      <div class="img-placeholder" title="画面示意（此公开版本已移除实际截图）">
        <span class="img-placeholder-icon">🖼️</span>
        <span class="img-placeholder-text">${schemaCaption ? esc(schemaCaption) : '画面截图（已移除）'}</span>
      </div>
    </div>`);
    if(state.editMode){
      parts.push(`<div class="step-img-wrap">
        <div class="img-drop-zone">
          <span class="img-paste-target" tabindex="0" data-imgkey="${keyBase}">📋 点这里，再按 Ctrl+V 贴上截图</span>
          <label class="img-upload-link">或选择档案上传<input type="file" accept="image/*" class="img-add-input" data-imgkey="${keyBase}" style="display:none;"></label>
        </div>
      </div>`);
    }
  } else if(state.editMode){
    parts.push(`<div class="step-img-wrap">
      <div class="img-drop-zone">
        <span class="img-paste-target" tabindex="0" data-imgkey="${keyBase}">📋 点这里，再按 Ctrl+V 贴上截图</span>
        <label class="img-upload-link">或选择档案上传<input type="file" accept="image/*" class="img-add-input" data-imgkey="${keyBase}" style="display:none;"></label>
      </div>
    </div>`);
  }
  return parts.join('');
}
function renderStepLi(step, keyBase, opts){
  opts = opts || {};
  let delHtml = '';
  if(state.editMode && opts.hideKey){
    delHtml = `<span class="step-del" data-hidekey="${opts.hideKey}">✕ 删除这步</span>`;
  } else if(state.editMode && opts.removable){
    delHtml = `<span class="step-del" data-listkey="${opts.listKey}" data-idx="${opts.extraIdx}" data-orderkey="${opts.orderKey}" data-origidx="${opts.origIdx}">✕ 删除这步</span>`;
  }
  const dragAttrs = (state.editMode && opts.orderKey!==undefined) ? ` draggable="true" data-orderkey="${opts.orderKey}" data-origidx="${opts.origIdx}" data-totallen="${opts.totalLen}"${opts.tmplPairIdx!==undefined?` data-tmplpairidx="${opts.tmplPairIdx}"`:''}` : '';
  if(typeof step === 'string') step = { text: step };

function compressImageDataUrl(dataUrl, maxDim, quality){
  return new Promise((resolve)=>{
    let settled = false;
    const done = (v)=>{ if(settled) return; settled = true; resolve(v); };
    const timeout = setTimeout(()=> done(dataUrl), 4000);
    try{
      const img = new Image();
      img.onload = ()=>{
        clearTimeout(timeout);
        let w = img.naturalWidth, h = img.naturalHeight;
        if(!w || !h){ done(dataUrl); return; }
        if(maxDim && Math.max(w,h) > maxDim){
          const scale = maxDim / Math.max(w,h);
          w = Math.round(w*scale); h = Math.round(h*scale);
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        // Neither WebP nor JPEG carry a transparency channel here — fill white
        // first so a transparent PNG (e.g. an annotated screenshot) doesn't
        // turn black.
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        const q = quality || 0.82;
        let best = dataUrl;
        // WebP usually beats JPEG at the same visual quality, so try it
        // first. Some browsers silently ignore an unsupported requested type
        // and hand back a PNG instead of throwing — detect that and skip it.
        try{
          const webpUrl = canvas.toDataURL('image/webp', q);
          if(webpUrl.indexOf('data:image/webp')===0 && webpUrl.length < best.length) best = webpUrl;
        }catch(e){}
        try{
          const jpegUrl = canvas.toDataURL('image/jpeg', q);
          if(jpegUrl.length < best.length) best = jpegUrl;
        }catch(e){}
        done(best);
      };
      img.onerror = ()=>{ clearTimeout(timeout); done(dataUrl); };
      img.src = dataUrl;
    }catch(e){ clearTimeout(timeout); done(dataUrl); }
  });
}
async function saveImageForKey(key, dataUrl, mode){
  snapshotUndo();
  const compressed = await compressImageDataUrl(dataUrl, 1280, 0.72);
  if(compressed.length > 2*1024*1024){
    alert('这张图片压缩后仍然太大（超过 2MB），浏览器储存空间有限，可能会存不进去。建议换一张比较小的截图。');
  }
  if(mode==='add'){
    const list = ov(key+'.extraImages', null) || [];
    list.push(compressed);
    state.overrides[key+'.extraImages'] = list;
  } else {
    state.overrides[key+'.imgData'] = compressed;
    state.overrides[key+'.imgRemoved'] = '0';
  }
  persist();
  renderDetail();
}

/* paste an image from clipboard directly into the step/box you're focused in.
   Resolution order: 1) an .img-paste-target itself is focused (the dedicated,
   discoverable drop-zone) 2) any element inside the same <li> as an image slot
   3) fallback: still block the browser's own raw <img> insertion so a paste
   never silently dumps an unmanaged, non-clickable image into random text. */
document.addEventListener('paste', (e)=>{
  if(!state.editMode) return;
  const items = e.clipboardData && e.clipboardData.items;
  if(!items) return;

  const active = document.activeElement;
  let key = null;
  let imgMode = null;
  if(active){
    if(active.classList && active.classList.contains('img-paste-target')){
      key = active.getAttribute('data-imgkey');
      imgMode = active.getAttribute('data-imgmode');
    } else {
      const li = active.closest ? active.closest('li') : null;
      const marker = li ? li.querySelector('.img-add-input, .img-remove-btn') : null;
      key = marker ? marker.getAttribute('data-imgkey') : null;
      imgMode = marker ? marker.getAttribute('data-imgmode') : null;
    }
  }

  function finish(dataUrlOrBlob, isFile){
    if(!key){
      alert('这个位置没有对应的图片栏位。请先点一下步骤下面「📋 点这里，再按 Ctrl+V 贴上截图」，再贴上。');
      return;
    }
    if(isFile){
      if(dataUrlOrBlob.size > 12*1024*1024){ alert('图片太大（超过 12MB），请换一张比较小的截图。'); return; }
      const reader = new FileReader();
      reader.onload = ()=> saveImageForKey(key, reader.result, imgMode);
      reader.readAsDataURL(dataUrlOrBlob);
    } else {
      saveImageForKey(key, dataUrlOrBlob, imgMode);
    }
  }

  // Path 1: clipboard has a real image file (typical for OS screenshot tools / "copy image as")
  let imageFile = null;
  for(const item of items){
    if(item.type && item.type.indexOf('image')===0){ imageFile = item.getAsFile(); break; }
  }
  if(imageFile){
    e.preventDefault();
    finish(imageFile, true);
    return;
  }

  // Path 2: clipboard only has an HTML fragment referencing an <img> (typical for "Copy image" from a webpage)
  const html = e.clipboardData.getData && e.clipboardData.getData('text/html');
  if(html){
    const match = html.match(/<img[^>]+src=["']([^"']+)["']/i);
    if(match){
      const src = match[1];
      e.preventDefault();
      if(src.indexOf('data:image') === 0){
        finish(src, false);
      } else {
        fetch(src).then(r=>r.blob()).then(blob=>{
          if(blob.size > 12*1024*1024){ alert('图片太大（超过 12MB），请换一张比较小的截图。'); return; }
          const reader = new FileReader();
          reader.onload = ()=> saveImageForKey(key, reader.result, imgMode);
          reader.readAsDataURL(blob);
        }).catch(()=>{
          alert('无法读取这张贴上的图片（可能是跨网域限制）。建议改用「螢幕截图」工具后贴上，或先把图片存到电脑再点「或选择档案上传」。');
        });
      }
      return;
    }
  }
  // Path 3: pasting text into an editable field — strip all formatting so an
  // external font/color/etc. can never sneak back in; insert as plain text only.
  const editableTarget = active && active.closest ? active.closest('[contenteditable="true"]') : null;
  if(editableTarget){
    const text = e.clipboardData.getData('text/plain');
    if(text !== undefined){
      e.preventDefault();
      const sel = window.getSelection();
      if(sel && sel.rangeCount>0){
        const range = sel.getRangeAt(0);
        range.deleteContents();
        const lines = text.split(/\r\n|\r|\n/);
        const frag = document.createDocumentFragment();
        let lastNode = null;
        lines.forEach((line, i)=>{
          if(i>0) frag.appendChild(document.createElement('br'));
          lastNode = document.createTextNode(line);
          frag.appendChild(lastNode);
        });
        range.insertNode(frag);
        if(lastNode){
          range.setStartAfter(lastNode);
          range.collapse(true);
          sel.removeAllRanges();
          sel.addRange(range);
        }
        persistEditable(editableTarget);
      }
    }
    return;
  }
  // nothing recognizable in the clipboard — let default paste behaviour proceed (plain text etc.)
});

function getOptOrder(key, length){
  const stored = state.overrides[key];
  const ids = Array.from({length}, (_,i)=>i);
  if(!stored || !Array.isArray(stored)) return ids;
  const filtered = stored.filter(i=>i<length);
  const missing = ids.filter(i=>!filtered.includes(i));
  return [...filtered, ...missing];
}
function getExtraOpts(key){
  const v = ov(key, null);
  return Array.isArray(v) ? v : [];
}
function getCombinedOptions(schemaOptions, orderKey){
  return schemaOptions.concat(getExtraOpts(orderKey+'.extraOpts'));
}
function renderPillRow(options, selectedIdx, dataAttr, orderKey, labelKeyPrefix, schemaLen){
  if(schemaLen===undefined) schemaLen = options.length;
  const order = getOptOrder(orderKey, options.length);
  let hiddenCount = 0;
  const pillsHtml = order.map(i=>{
    const o = options[i];
    if(!o) return '';
    if(i < schemaLen && ov(labelKeyPrefix+i+'.hidden', null)==='1'){ hiddenCount++; return ''; }
    const sel = i===selectedIdx;
    const delHtml = state.editMode ? `<span class="pill-del" data-idx="${i}" data-orderkey="${orderKey}" data-labelkeyprefix="${labelKeyPrefix}" data-schemalen="${schemaLen}" title="删除这个选项">✕</span>` : '';
    return `<span class="pill${sel?' sel tone-'+(o.tone||'plain'):''}"${state.editMode?` draggable="true" data-orderkey="${orderKey}" data-origidx="${i}" data-totallen="${options.length}"`:''} data-${dataAttr}="${i}">${edText(labelKeyPrefix+i+'.label', o.label)}${delHtml}</span>`;
  }).join('');
  const restoreHtml = (hiddenCount && state.editMode) ? `<span class="pill-restore" data-orderkey="${orderKey}" data-labelkeyprefix="${labelKeyPrefix}" data-schemalen="${schemaLen}">↺ 还原 ${hiddenCount}</span>` : '';
  const addHtml = state.editMode ? `<span class="pill-add" data-orderkey="${orderKey}" data-labelkeyprefix="${labelKeyPrefix}">+ 新增选项</span>` : '';
  return pillsHtml + restoreHtml + addHtml;
}
function renderDecisionResult(wf){
  const l0RootOrderKey = wf.id+'.root.order';
  const l0SchemaLen = wf.root.options.length;
  const l0Options = getCombinedOptions(wf.root.options, l0RootOrderKey);
  const l0 = l0Options[state.path[0]] || l0Options[0];
  const hasNext = !!l0.next;
  const l1OrderKey = wf.id+'.opt0.'+state.path[0]+'.next.order';
  const l1SchemaLen = hasNext ? l0.next.options.length : 0;
  const l1Options = hasNext ? getCombinedOptions(l0.next.options, l1OrderKey) : null;
  const l1 = hasNext ? (l1Options[state.path[1]] || l1Options[0]) : null;
  const hasNext2 = l1 && !!l1.next;
  const l2OrderKey = wf.id+'.opt0.'+state.path[0]+'.opt1.'+state.path[1]+'.next.order';
  const l2SchemaLen = hasNext2 ? l1.next.options.length : 0;
  const l2Options = hasNext2 ? getCombinedOptions(l1.next.options, l2OrderKey) : null;
  const leaf = hasNext2 ? (l2Options[state.path[2]] || l2Options[0]) : (l1 || l0);
  const leafKey = `${wf.id}::${state.path[0]}.${hasNext?state.path[1]:'x'}.${hasNext2?state.path[2]:'x'}`;
  const preKey = wf.id+'::pre';
  const stepCounter = (wf.preSteps ? wf.preSteps.length : 0) + getExtraSteps(preKey).length;
  const out=[];
  if(wf.refimg) out.push(renderRefimg(wf.refimg, wf.id+'.refimg'));
  const introHidden = ov(wf.id+'.intro.hidden', null)==='1';
  const customIntro = ov(wf.id+'.customIntro', null);
  if(wf.intro && !introHidden){
    const delHtml = state.editMode ? `<span class="intro-del" data-wfid="${wf.id}">✕ 移除这个说明区块</span>` : '';
    out.push(`<div class="intro-wrap">${tmplBox(wf.intro.tmpl, wf.id+'::intro', {label: wf.intro.label})}${delHtml}</div>`);
  } else if(customIntro){
    const delHtml = state.editMode ? `<span class="intro-del" data-wfid="${wf.id}" data-custom="1">✕ 移除这个说明区块</span>` : '';
    out.push(`<div class="intro-wrap">${tmplBox(customIntro.tmpl, wf.id+'::customIntro', {label: customIntro.label})}${delHtml}</div>`);
  } else if(state.editMode){
    const restoreHtml = (wf.intro && introHidden) ? `<span class="intro-restore" data-wfid="${wf.id}">↺ 还原说明区块　</span>` : '';
    out.push(`<div style="margin-bottom:8px;">${restoreHtml}<span class="intro-add" data-wfid="${wf.id}">+ 新增说明区块</span></div>`);
  }
  if(wf.preSteps !== undefined || getExtraSteps(preKey).length || getExtraReplies(preKey).length){
    out.push(`<ul class="steps">${renderStepsList(wf.preSteps, preKey)}${renderAddStepBtn(preKey, (wf.preSteps||[]).length)}${renderAddReplyBtn(preKey, (wf.preSteps||[]).length, getExtraReplies(preKey).length)}</ul>`);
  }
  out.push(`<div class="pickrow"><span class="pickrow-label">${edText(wf.id+'.root.label', wf.root.label)}</span>${renderPillRow(l0Options, state.path[0], 'l0', l0RootOrderKey, wf.id+'.opt0.', l0SchemaLen)}</div>`);
  if(hasNext){
    const l0Key = wf.id+'.opt0.'+state.path[0];
    const l0HasExtra = getExtraSteps(l0Key).length > 0 || getExtraReplies(l0Key).length > 0;
    if((l0.steps && l0.steps.length) || l0HasExtra || state.editMode){
      out.push(`<div class="section-label">${edText(wf.id+'.checkStepsLabel', '查单步骤')}</div>`);
      out.push(`<ul class="steps">${renderStepsList(l0.steps, l0Key)}${renderAddStepBtn(l0Key, (l0.steps||[]).length)}${renderAddReplyBtn(l0Key, (l0.steps||[]).length, getExtraReplies(l0Key).length)}</ul>`);
    }
    out.push(`<div class="pickrow"><span class="pickrow-label">${edText(wf.id+'.opt0.'+state.path[0]+'.next.label', l0.next.label)}</span>${renderPillRow(l1Options, state.path[1], 'l1', l1OrderKey, wf.id+'.opt0.'+state.path[0]+'.opt1.', l1SchemaLen)}</div>`);
  }
  if(hasNext2){
    const l1Key = wf.id+'.opt0.'+state.path[0]+'.opt1.'+state.path[1];
    const l1HasExtra = getExtraSteps(l1Key).length > 0 || getExtraReplies(l1Key).length > 0;
    if((l1.steps && l1.steps.length) || l1HasExtra || state.editMode){
      out.push(`<ul class="steps">${renderStepsList(l1.steps, l1Key)}${renderAddStepBtn(l1Key, (l1.steps||[]).length)}${renderAddReplyBtn(l1Key, (l1.steps||[]).length, getExtraReplies(l1Key).length)}</ul>`);
    }
    out.push(`<div class="pickrow"><span class="pickrow-label">${edText(wf.id+'.opt0.'+state.path[0]+'.opt1.'+state.path[1]+'.next.label', l1.next.label)}</span>${renderPillRow(l2Options, state.path[2], 'l2', l2OrderKey, leafKey+'.opt2.', l2SchemaLen)}</div>`);
  }
  out.push(`<div class="result">`);
  const leafReplyHtml = leaf.reply ? tmplBox(leaf.reply, leafKey+'.reply', {}) : null;
  const leafHasExtra = getExtraSteps(leafKey).length > 0 || getExtraReplies(leafKey).length > 0;
  if((leaf.steps && leaf.steps.length) || leafReplyHtml || leafHasExtra || state.editMode){
    out.push(`<div class="section-label">${edText(wf.id+'.processStepsLabel', '处理步骤')}</div>`);
    out.push(`<ul class="steps" style="counter-reset:step ${stepCounter}">${renderStepsList(leaf.steps, leafKey, leafReplyHtml)}${renderAddStepBtn(leafKey, (leaf.steps||[]).length)}${renderAddReplyBtn(leafKey, (leaf.steps||[]).length, (leafReplyHtml?1:0)+getExtraReplies(leafKey).length)}</ul>`);
  }
  out.push(renderNoteBlock(leaf.note, leafKey+'.note'));
  if(leaf.extra){ out.push(renderExtras(leaf.extra, leafKey)); }
  out.push(`</div>`);
  return out.join('');
}

      if(ri < schemaLen && ov(wf.id+'.table'+ri+'.hidden', null)==='1'){ hiddenCount++; return ''; }
      const delHtml = state.editMode ? `<span class="table-row-del" data-idx="${ri}" data-wfid="${wf.id}" data-schemalen="${schemaLen}" title="删除这一行">✕</span>` : '';
      return `<tr><td>${edText(wf.id+'.table'+ri+'.0', r[0])}</td><td>${edText(wf.id+'.table'+ri+'.1', r[1])}${delHtml}</td></tr>`;
    }).join('');
    const restoreHtml = (hiddenCount && state.editMode) ? `<tr><td colspan="2"><span class="table-row-restore" data-wfid="${wf.id}" data-schemalen="${schemaLen}">↺ 还原 ${hiddenCount} 行</span></td></tr>` : '';
    const addHtml = state.editMode ? `<tr><td colspan="2"><span class="table-row-add" data-wfid="${wf.id}">+ 新增一行</span></td></tr>` : '';
    out.push(`<details><summary>${edText(wf.id+'.tableLabel', wf.detailsTable.label)}</summary><table class="kv">${rowsHtml}${restoreHtml}${addHtml}</table></details>`);
  }
  out.push(renderNoteBlock(wf.note, wf.id+'.note'));
  return out.join('');
}
