function wireIntervalTool(container){
  const root = container.querySelector('.itool');
  if(!root || root.dataset.wired) return;
  root.dataset.wired = '1';

  root.querySelectorAll('.itool-tabbtn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      root.querySelectorAll('.itool-tabbtn').forEach(b=>b.classList.remove('active'));
      root.querySelectorAll('.itool-panel').forEach(p=>p.classList.remove('active'));
      btn.classList.add('active');
      root.querySelector(`.itool-panel[data-itool-panel="${btn.getAttribute('data-itool-tab')}"]`).classList.add('active');
    });
  });

  // ---------- tool 1: interval filter ----------
  function processInterval(text){
    const lines = text.split(/\r?\n/);
    const blocks = [];
    let current = null;
    for (const raw of lines){
      const trimmed = raw.trim();
      if (trimmed === '') continue;
      const isDataLine = /单位/.test(trimmed);
      if (!isDataLine){
        current = { header: trimmed, lines: [] };
        blocks.push(current);
      } else if (current){
        current.lines.push(trimmed);
      }
    }
    const keep = blocks.filter(b => b.header === '淘宝' || b.header === '支付宝出款');
    const renamed = keep.map(b => ({
      header: b.header === '淘宝' ? '支付宝' : b.header,
      lines: b.lines
    }));
    return renamed.map(b => b.header + '\n' + b.lines.join('\n')).join('\n\n');
  }
  const inputEl = root.querySelector('.itool-input');
  const outputEl = root.querySelector('.itool-output');
  function update1(){
    const val = inputEl.value;
    outputEl.value = val.trim() ? processInterval(val) : '';
  }
  inputEl.addEventListener('input', update1);
  root.querySelector('.itool-copy1').addEventListener('click', ()=>{ copyText(root.querySelector('.itool-copy1'), outputEl.value); });
  root.querySelector('.itool-clear1').addEventListener('click', ()=>{ inputEl.value=''; outputEl.value=''; });

  // ---------- tool 2: compare & merge ----------
  function extractRange(str){
    const available = str.indexOf('✅') !== -1;
    if (!available) return { available: false };
    const nums = str.match(/[\d,]+(?:\.\d+)?/g);
    if (!nums || nums.length < 2) return { available: true, min: null, max: null };
    const min = parseFloat(nums[0].replace(/,/g, ''));
    const max = parseFloat(nums[1].replace(/,/g, ''));
    return { available: true, min, max };
  }
  function normalizeKey(token){
    let k = token.replace(/^[^A-Za-z0-9_]+/, '').replace(/[:：]\s*$/, '').trim().toUpperCase();
    k = k.split('_')[0];
    return k;
  }
  function isDirectionHeader(line){
    const l = line.replace(/[:：]\s*$/, '').trim().toLowerCase();
    if (l === 'deposit' || l === '存款') return 'deposit';
    if (l === 'payout' || l === '出款') return 'payout';
    return null;
  }
  function parseSource(text){
    const result = {};
    const blocks = text.split(/\n\s*\n/).map(b => b.trim()).filter(Boolean);
    for (const block of blocks){
      const lines = block.split(/\n/).map(l => l.trim()).filter(Boolean);
      if (lines.length === 0) continue;
      const dirHeader = isDirectionHeader(lines[0]);
      if (dirHeader){
        for (let i = 1; i < lines.length; i++){
          const m = lines[i].match(/^(.+?)\s*[:：]\s*(.+)$/);
          if (!m) continue;
          const key = normalizeKey(m[1]);
          if (!key) continue;
          if (!result[key]) result[key] = { deposit: [], payout: [] };
          result[key][dirHeader].push(extractRange(m[2]));
        }
        continue;
      }
      let header = lines[0].replace(/^[^A-Za-z\u4e00-\u9fff]+/, '').replace(/[:：]\s*$/, '').trim();
      const key = header.toUpperCase();
      if (!key) continue;
      const deposit = [];
      const payout = [];
      for (let i = 1; i < lines.length; i++){
        const line = lines[i];
        let m, direction = null, content = null;
        if (m = line.match(/^pay in\s*[:：]?\s*(.+)$/i)) { direction = 'deposit'; content = m[1]; }
        else if (m = line.match(/^存款\s*[:：]?\s*(.+)$/)) { direction = 'deposit'; content = m[1]; }
        else if (m = line.match(/^pay out\s*[:：]?\s*(.+)$/i)) { direction = 'payout'; content = m[1]; }
        else if (m = line.match(/^出款\s*[:：]?\s*(.+)$/)) { direction = 'payout'; content = m[1]; }
        if (direction === 'deposit') deposit.push(extractRange(content));
        if (direction === 'payout') payout.push(extractRange(content));
      }
      if (deposit.length === 0 && payout.length === 0) continue;
      if (!result[key]) result[key] = { deposit: [], payout: [] };
      result[key].deposit.push(...deposit);
      result[key].payout.push(...payout);
    }
    return result;
  }
  function formatNum(n){ return Math.round(n).toLocaleString('en-US'); }
  function statusFor(list){
    const avail = list.filter(e => e.available);
    if (avail.length === 0) return '⛔️ Maintenance 維護中';
    const mins = avail.filter(e => e.min != null).map(e => e.min);
    const maxs = avail.filter(e => e.max != null).map(e => e.max);
    if (mins.length && maxs.length) return '✅ ' + formatNum(Math.min(...mins)) + ' ~ ' + formatNum(Math.max(...maxs));
    return '✅';
  }
  function individualStatus(list){
    if (!list || list.length === 0) return '-';
    return statusFor(list);
  }
  const DISPLAY_NAMES = { BKASH: 'bKash', NAGAD: 'Nagad', ROCKET: 'Rocket', UPAY: 'Upay' };
  function displayName(key){ return DISPLAY_NAMES[key] || (key.charAt(0) + key.slice(1).toLowerCase()); }
  const PRIORITY = ['NAGAD', 'BKASH', 'ROCKET', 'UPAY'];
  function getOrder(parsedList){
    const order = [];
    for (const src of parsedList) for (const key of Object.keys(src)) if (!order.includes(key)) order.push(key);
    const inPriority = PRIORITY.filter(p => order.includes(p));
    const others = order.filter(k => !PRIORITY.includes(k));
    return [...inPriority, ...others];
  }
  function renderCmpTable(el, keys, parsedList, direction){
    if (keys.length === 0){ el.innerHTML = ''; return; }
    var html = '<table class="itool-cmptable"><tr><th>平台</th>';
    parsedList.forEach(function(_, i){ html += '<th>来源 ' + (i+1) + '</th>'; });
    html += '<th class="itool-suggestedcol">建议</th></tr>';
    keys.forEach(function(key){
      html += '<tr><td style="font-weight:600;">' + displayName(key) + '</td>';
      var lists = [];
      parsedList.forEach(function(src){
        var list = src[key] && src[key][direction];
        lists.push(list || []);
        html += '<td>' + individualStatus(list) + '</td>';
      });
      var merged = [].concat.apply([], lists);
      html += '<td style="font-weight:600;">' + statusFor(merged) + '</td></tr>';
    });
    html += '</table>';
    el.innerHTML = html;
  }
  function buildFinalText(texts){
    const merged = {};
    const order = [];
    for (const text of texts){
      if (!text || !text.trim()) continue;
      const src = parseSource(text);
      for (const key of Object.keys(src)){
        if (!merged[key]) { merged[key] = { deposit: [], payout: [] }; order.push(key); }
        merged[key].deposit.push(...src[key].deposit);
        merged[key].payout.push(...src[key].payout);
      }
    }
    const inPriority = PRIORITY.filter(p => order.includes(p));
    const others = order.filter(k => !PRIORITY.includes(k));
    const keys = [...inPriority, ...others];
    if (keys.length === 0) return '';
    const depositLines = ['Deposit:'];
    const payoutLines = ['Payout:'];
    for (const key of keys) depositLines.push(displayName(key) + ' : ' + statusFor(merged[key].deposit));
    for (const key of keys) payoutLines.push(displayName(key) + ' Payout : ' + statusFor(merged[key].payout));
    return depositLines.join('\n') + '\n\n' + payoutLines.join('\n');
  }

  const sourcesContainer = root.querySelector('.itool-sources');
  const depositTableEl = root.querySelector('.itool-deposittable');
  const payoutTableEl = root.querySelector('.itool-payouttable');
  const output2El = root.querySelector('.itool-output2');
  let sourceCount = 0;
  function update2(){
    const boxes = sourcesContainer.querySelectorAll('textarea');
    const texts = Array.prototype.map.call(boxes, t=>t.value);
    const hasAny = texts.some(t=>t.trim());
    const parsedList = texts.map(t => t && t.trim() ? parseSource(t) : {});
    const keys = hasAny ? getOrder(parsedList) : [];
    renderCmpTable(depositTableEl, keys, parsedList, 'deposit');
    renderCmpTable(payoutTableEl, keys, parsedList, 'payout');
    output2El.value = hasAny ? buildFinalText(texts) : '';
  }
  function addSourceBox(){
    sourceCount++;
    const idx = sourceCount;
    const wrap = document.createElement('div');
    wrap.className = 'itool-srcbox';
    wrap.innerHTML = `<div class="itool-srchead">
        <label class="itool-srclabel">来源 ${idx}</label>
        <button class="btn itool-removesrc">移除</button>
      </div>
      <textarea rows="5" placeholder="粘贴数据（标题/说明文字会自动忽略）"></textarea>`;
    sourcesContainer.appendChild(wrap);
    wrap.querySelector('textarea').addEventListener('input', update2);
    wrap.querySelector('.itool-removesrc').addEventListener('click', ()=>{ wrap.remove(); update2(); });
  }
  for (let i = 0; i < 3; i++) addSourceBox();
  root.querySelector('.itool-addsrc').addEventListener('click', addSourceBox);
  root.querySelector('.itool-copy2').addEventListener('click', ()=>{ copyText(root.querySelector('.itool-copy2'), output2El.value); });
  root.querySelector('.itool-clearall').addEventListener('click', ()=>{
    sourcesContainer.querySelectorAll('textarea').forEach(t=>t.value='');
    update2();
  });
}
function renderRuleExtraBlocks(it, keyBase){
  const parts = [renderStepImgBlock(it, keyBase)];
  const tmplKey = keyBase+'.tmpl';
  const removed = ov(tmplKey+'.boxRemoved', null)==='1';

function renderReference(wf){
  const out=[];
  if(wf.refimg) out.push(renderRefimg(wf.refimg, wf.id+'.refimg'));
  const schemaSecLen = wf.sections.length;
  const extraSections = getExtraOpts(wf.id+'.extraSections');
  const allSections = wf.sections.concat(extraSections);
  let hiddenSecCount = 0;
  allSections.forEach((sec,i)=>{
    if(i < schemaSecLen && ov(wf.id+'.sec'+i+'.hidden', null)==='1'){ hiddenSecCount++; return; }
    const secDelHtml = state.editMode ? `<div class="sec-del" data-idx="${i}" data-wfid="${wf.id}" data-schemalen="${schemaSecLen}">✕ 删除这个区块</div>` : '';
    if(sec.kind==='rules'){
      const schemaItemLen = sec.items.length;
      const extraItems = getExtraOpts(wf.id+'.sec'+i+'.extraRules');
      const allItems = sec.items.concat(extraItems);
      let hiddenItemCount = 0;
      const cardsHtml = allItems.map((it,j)=>{
        if(j < schemaItemLen && ov(wf.id+'.sec'+i+'.rule'+j+'.hidden', null)==='1'){ hiddenItemCount++; return ''; }
        const ruleKeyBase = wf.id+'.sec'+i+'.rule'+j;
        const itemDelHtml = state.editMode ? `<span class="rule-del" data-idx="${j}" data-wfid="${wf.id}" data-secidx="${i}" data-schemalen="${schemaItemLen}">✕</span>` : '';
        return `<div class="rule-card"><b>${edText(ruleKeyBase+'.title', it.title)}${itemDelHtml}</b>${edText(ruleKeyBase+'.body', it.body)}${renderRuleExtraBlocks(it, ruleKeyBase)}</div>`;
      }).join('');
      const itemRestoreHtml = (hiddenItemCount && state.editMode) ? `<div class="rule-card rule-restore" data-wfid="${wf.id}" data-secidx="${i}" data-schemalen="${schemaItemLen}">↺ 还原 ${hiddenItemCount}</div>` : '';
      const itemAddHtml = state.editMode ? `<div class="rule-card rule-add" data-wfid="${wf.id}" data-secidx="${i}">+ 新增一条</div>` : '';
      out.push(`<div class="rule-grid">${cardsHtml}${itemRestoreHtml}${itemAddHtml}</div>${secDelHtml}`);
    } else if(sec.kind==='template'){
      out.push(tmplBox(sec.text, wf.id+'::sec'+i, {}));
      out.push(renderStepImgBlock(sec, wf.id+'.sec'+i));
      if(secDelHtml) out.push(secDelHtml);
    } else if(sec.kind==='text'){
      out.push(`<div class="note-line" style="border-top:none; padding-top:0; margin-top:10px;">${sec.heading?`<b>${edText(wf.id+'.sec'+i+'.heading', sec.heading)}：</b>`:''}${edText(wf.id+'.sec'+i+'.body', sec.body)}${secDelHtml}</div>`);
    } else if(sec.kind==='widget' && sec.widget==='intervalTool'){
      out.push(renderIntervalToolHtml(wf.id+'.sec'+i));
      if(secDelHtml) out.push(secDelHtml);
    }
  });
  const secRestoreHtml = (hiddenSecCount && state.editMode) ? `<div class="sec-restore" data-wfid="${wf.id}" data-schemalen="${schemaSecLen}">↺ 还原 ${hiddenSecCount} 个区块</div>` : '';
  const secAddHtml = state.editMode ? `<div class="sec-add" data-wfid="${wf.id}">+ 新增文字区块</div>` : '';
  out.push(secRestoreHtml + secAddHtml);
  const referenceReplyHtml = wf.reply ? tmplBox(wf.reply, wf.id+'::reply', {}) : null;
  const hasExtraStepContent = getExtraSteps(wf.id).length > 0 || getExtraReplies(wf.id).length > 0;
  if((wf.steps && wf.steps.length) || referenceReplyHtml || hasExtraStepContent || state.editMode){
    out.push(`<div class="section-label">${edText(wf.id+'.extraStepsLabel', '补充步骤')}</div>`);
    out.push(`<ul class="steps">${renderStepsList(wf.steps, wf.id, referenceReplyHtml)}${renderAddStepBtn(wf.id, (wf.steps||[]).length)}${renderAddReplyBtn(wf.id, (wf.steps||[]).length, (referenceReplyHtml?1:0)+getExtraReplies(wf.id).length)}</ul>`);
  }
  return out.join('');
}

      snapshotUndo();
      const length = parseInt(p.getAttribute('data-totallen')) || [...stage.querySelectorAll(`.pill[data-orderkey="${key}"]`)].length;
      let order = getOptOrder(key, length);
      const fromPos = order.indexOf(pillDragSrc.idx);
      order.splice(fromPos,1);
      let toPos = order.indexOf(toIdx);
      if(!isBefore) toPos += 1;
      order.splice(toPos,0,pillDragSrc.idx);
      state.overrides[key] = order;
      persist();
      renderDetail();
      setTimeout(()=>{
        const moved = stage.querySelector(`.pill[data-orderkey="${key}"][data-origidx="${pillDragSrc.idx}"]`);
        if(moved){ moved.classList.add('pill-moved'); setTimeout(()=>moved.classList.remove('pill-moved'), 900); }
      }, 0);
    });
  });
  let extraBtnDragSrc = null;
  const clearExtraBtnDropIndicators = ()=> stage.querySelectorAll('.extra-btn.drop-before, .extra-btn.drop-after').forEach(el=>el.classList.remove('drop-before','drop-after'));
  stage.querySelectorAll('.extra-btn[data-orderkey]').forEach(b=>{
    b.addEventListener('dragstart', (e)=>{
      e.stopPropagation();
      extraBtnDragSrc = { key: b.getAttribute('data-orderkey'), idx: parseInt(b.getAttribute('data-origidx')) };
      b.classList.add('dragging');
    });
    b.addEventListener('dragend', ()=>{ b.classList.remove('dragging'); clearExtraBtnDropIndicators(); });
    b.addEventListener('dragover', (e)=>{
      if(!extraBtnDragSrc || extraBtnDragSrc.key!==b.getAttribute('data-orderkey')) return;
      e.preventDefault(); e.stopPropagation();
      const rect = b.getBoundingClientRect();
      const isBefore = (e.clientX - rect.left) < rect.width/2;
      clearExtraBtnDropIndicators();
      b.classList.add(isBefore ? 'drop-before' : 'drop-after');
    });
    b.addEventListener('dragleave', ()=>{ b.classList.remove('drop-before','drop-after'); });
    b.addEventListener('drop', (e)=>{
      const key = b.getAttribute('data-orderkey');
      if(!extraBtnDragSrc || extraBtnDragSrc.key!==key) return;
      e.preventDefault(); e.stopPropagation();
      clearExtraBtnDropIndicators();
      const rect = b.getBoundingClientRect();
      const isBefore = (e.clientX - rect.left) < rect.width/2;
      const toIdx = parseInt(b.getAttribute('data-origidx'));
      if(toIdx===extraBtnDragSrc.idx) return;
      snapshotUndo();
      const length = parseInt(b.getAttribute('data-totallen')) || [...stage.querySelectorAll(`.extra-btn[data-orderkey="${key}"]`)].length;
      let order = getOptOrder(key, length);
      const fromPos = order.indexOf(extraBtnDragSrc.idx);
      order.splice(fromPos,1);
      let toPos = order.indexOf(toIdx);
      if(!isBefore) toPos += 1;
      order.splice(toPos,0,extraBtnDragSrc.idx);
      state.overrides[key] = order;
      persist();
      renderDetail();
      setTimeout(()=>{
        const moved = stage.querySelector(`.extra-btn[data-orderkey="${key}"][data-origidx="${extraBtnDragSrc.idx}"]`);
        if(moved){ moved.classList.add('extra-moved'); setTimeout(()=>moved.classList.remove('extra-moved'), 900); }
      }, 0);
    });
  });
  let stepDragSrc = null;
  const clearStepDropIndicators = ()=> stage.querySelectorAll('.steps > li.drop-before, .steps > li.drop-after').forEach(el=>el.classList.remove('drop-before','drop-after'));
  stage.querySelectorAll('.steps > li[data-orderkey]').forEach(li=>{
    li.addEventListener('dragstart', (e)=>{
      e.stopPropagation();
      const pairedAttr = li.getAttribute('data-tmplpairidx');
      stepDragSrc = {
        key: li.getAttribute('data-orderkey'),
        idx: parseInt(li.getAttribute('data-origidx')),
        pairedIdx: pairedAttr!==null ? parseInt(pairedAttr) : null,
      };
      li.classList.add('dragging');
      if(stepDragSrc.pairedIdx!==null){
        const pairedLi = stage.querySelector(`.steps > li[data-orderkey="${stepDragSrc.key}"][data-origidx="${stepDragSrc.pairedIdx}"]`);
        if(pairedLi) pairedLi.classList.add('dragging-paired');
      }
    });
    li.addEventListener('dragend', ()=>{
      li.classList.remove('dragging');
      stage.querySelectorAll('.dragging-paired').forEach(el=>el.classList.remove('dragging-paired'));
      clearStepDropIndicators();
    });
    li.addEventListener('dragover', (e)=>{
      if(!stepDragSrc || stepDragSrc.key!==li.getAttribute('data-orderkey')) return;
      e.preventDefault(); e.stopPropagation();
      const rect = li.getBoundingClientRect();
      const isBefore = (e.clientY - rect.top) < rect.height/2;
      clearStepDropIndicators();
      li.classList.add(isBefore ? 'drop-before' : 'drop-after');
    });
    li.addEventListener('dragleave', ()=>{ li.classList.remove('drop-before','drop-after'); });
    li.addEventListener('drop', (e)=>{
      const key = li.getAttribute('data-orderkey');
      if(!stepDragSrc || stepDragSrc.key!==key) return;
      e.preventDefault(); e.stopPropagation();
      clearStepDropIndicators();
      const rect = li.getBoundingClientRect();
      const isBefore = (e.clientY - rect.top) < rect.height/2;
      const toIdx = parseInt(li.getAttribute('data-origidx'));
      if(toIdx===stepDragSrc.idx || toIdx===stepDragSrc.pairedIdx) return;
      snapshotUndo();
      const length = parseInt(li.getAttribute('data-totallen')) || [...stage.querySelectorAll(`.steps > li[data-orderkey="${key}"]`)].length;
      let order = getOptOrder(key, length);
      const fromPos = order.indexOf(stepDragSrc.idx);
      order.splice(fromPos,1);
      let pairedRemoved = false;
      if(stepDragSrc.pairedIdx!==null){
        const pairedPos = order.indexOf(stepDragSrc.pairedIdx);
        if(pairedPos!==-1){ order.splice(pairedPos,1); pairedRemoved = true; }
      }
      let toPos = order.indexOf(toIdx);
      if(!isBefore) toPos += 1;
      const insertGroup = pairedRemoved ? [stepDragSrc.idx, stepDragSrc.pairedIdx] : [stepDragSrc.idx];
      order.splice(toPos,0,...insertGroup);
      state.overrides[key] = order;
      persist();
      renderDetail();
      setTimeout(()=>{
        const moved = stage.querySelector(`.steps > li[data-orderkey="${key}"][data-origidx="${stepDragSrc.idx}"]`);
        if(moved){ moved.classList.add('step-moved'); setTimeout(()=>moved.classList.remove('step-moved'), 900); }
      }, 0);
    });
  });
  stage.querySelectorAll('.chip').forEach(c=>{
    c.onclick=(e)=>{ if(e.target.closest('[contenteditable="true"]') || e.target.closest('.chip-del')) return; navigator.clipboard && navigator.clipboard.writeText(c.getAttribute('data-copy')); c.style.color='var(--success)'; setTimeout(()=>c.style.color='',900); };
  });
  stage.querySelectorAll('.refimg-thumb').forEach(img=>{
    img.onclick=()=>{ document.getElementById('lightboxImg').src=img.getAttribute('data-full'); document.getElementById('lightbox').classList.add('open'); };
  });
  stage.querySelectorAll('[contenteditable="true"]').forEach(node=>{
    node.addEventListener('input', ()=> persistEditable(node));
  });
}

const LASTVIEW_KEY = 'payment-ops-runbook-lastview';
function saveLastView(){
  // deliberately NOT part of state.overrides — this is a personal "where was
  // I" bookmark for this browser only, and must never sync to teammates.
  try{ localStorage.setItem(LASTVIEW_KEY, JSON.stringify({cat: state.activeCat, wf: state.activeWF, path: state.path})); }catch(e){}
}
function loadLastView(){
  try{ const raw = localStorage.getItem(LASTVIEW_KEY); return raw ? JSON.parse(raw) : null; }catch(e){ return null; }
}
function renderStage(){
  saveLastView();
  if(state.activeWF) renderDetail();
  else renderGrid();
  // Belt-and-suspenders: normalize EVERY link inside the stage after every
  // render, not just ones freshly created through the link-insert UI. Static
  // template text (context/tip/label/title fallback strings baked into the
  // source, e.g. Confluence/Google Sheet links) is dropped into the page via
  // plain string interpolation and never passes through persistEditable() —
  // so without this pass those links kept opening in the same tab even
  // though the earlier fix worked correctly for newly-inserted links.
  normalizeLinksToOpenInNewTab(document.getElementById('stage'));
}

/* ---- custom modal (replaces prompt()/confirm(), which some embedded/sandboxed
   browser contexts silently block, making buttons look like they "do nothing") ---- */
let modalResolver = null;
function closeModal(){
  document.getElementById('modalOverlay').classList.remove('show');
  modalResolver = null;
}
function showInputModal(title, hint, defaultValue, onConfirm){
  const overlay = document.getElementById('modalOverlay');
  const input = document.getElementById('modalInput');
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalHint').textContent = hint || '';
  document.getElementById('modalHint').style.display = hint ? 'block' : 'none';
  document.getElementById('modalChips').style.display = 'none';
  document.getElementById('modalOk').style.display = '';
  document.getElementById('modalOk').textContent = '确定';
  document.getElementById('modalTextarea').style.display = 'none';
  input.style.display = 'block';
  input.placeholder = ''; // this shared field is reused for very different prompts (tag names, URLs, step text...) — always start blank instead of leaking whichever placeholder a previous modal happened to set
  input.value = defaultValue || '';
  overlay.classList.add('show');
  setTimeout(()=>{ input.focus(); input.select(); }, 0);
  modalResolver = (ok)=>{ if(ok) onConfirm(input.value.trim()); };
}
function showTextareaModal(title, hint, defaultValue, onConfirm){
  // same as showInputModal, but for free-text "content" prompts (reply
  // template content, note/section bodies) that are routinely multi-line —
  // a single-line <input> forced people to paste line breaks in afterward
  // by editing the box a second time.
  const overlay = document.getElementById('modalOverlay');
  const textarea = document.getElementById('modalTextarea');
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalHint').textContent = hint || '';
  document.getElementById('modalHint').style.display = hint ? 'block' : 'none';
  document.getElementById('modalChips').style.display = 'none';
  document.getElementById('modalOk').style.display = '';
  document.getElementById('modalOk').textContent = '确定';
  document.getElementById('modalInput').style.display = 'none';
  textarea.style.display = 'block';
  textarea.value = defaultValue || '';
  overlay.classList.add('show');
  setTimeout(()=>{ textarea.focus(); textarea.select(); }, 0);
  modalResolver = (ok)=>{ if(ok) onConfirm(textarea.value.trim()); };
}
function showTmplPickerModal(onPick){
  const overlay = document.getElementById('modalOverlay');
  const input = document.getElementById('modalInput');
  const chips = document.getElementById('modalChips');
  document.getElementById('modalTitle').textContent = '新增回覆模板';
  document.getElementById('modalHint').style.display = 'block';
  input.style.display = 'none';
  document.getElementById('modalOk').style.display = 'none';
  overlay.classList.add('show');
  modalResolver = ()=>{};
  function renderChips(){
    const palette = getTmplPalette();
    document.getElementById('modalHint').textContent = palette.length ? '点一下直接套用已有模板，或自订新内容：' : '目前还没有可重复使用的模板，请自订新内容：';
    const paletteChips = palette.map(t=>`<span class="modal-chip" data-label="${esc(t.label)}">${esc(t.label)}<span class="modal-chip-edit" data-label="${esc(t.label)}" title="编辑标题">✎</span><span class="modal-chip-del" data-label="${esc(t.label)}" title="从清单移除">×</span></span>`).join('');
    const customChip = `<span class="modal-chip modal-chip-custom" data-custom="1">+ 自订新内容</span>`;
    chips.innerHTML = paletteChips + customChip;
    chips.style.display = 'flex';
    chips.querySelectorAll('.modal-chip').forEach(chip=>{
      chip.onclick = (e)=>{
        if(e.target.closest('.modal-chip-del') || e.target.closest('.modal-chip-edit')) return;
        if(chip.getAttribute('data-custom')==='1'){
          closeModal();
          showInputModal('新增回覆模板：标题（可留空）', '', '', (label)=>{
            showTextareaModal('新增回覆模板：内容', '', '', (tmpl)=>{
              if(!tmpl) return;
              addToTmplPalette(label||'回覆模板', tmpl);
              onPick({label: label||'', tmpl});
            });
          });
          return;
        }
        const label = chip.getAttribute('data-label');
        const entry = getTmplPalette().find(t=>t.label===label);
        closeModal();
        if(entry) onPick({label: entry.label, tmpl: entry.tmpl});
      };
    });
    chips.querySelectorAll('.modal-chip-edit').forEach(editBtn=>{
      editBtn.onclick = (e)=>{
        e.stopPropagation();
        const label = editBtn.getAttribute('data-label');
        closeModal();
        showInputModal('编辑模板标题', '', label, (newLabel)=>{
          if(!newLabel || newLabel===label) { showTmplPickerModal(onPick); return; }
          snapshotUndo();
          const palette = getTmplPalette();
          const idx = palette.findIndex(t=>t.label===label);
          if(idx!==-1){
            palette[idx] = Object.assign({}, palette[idx], {label:newLabel});
            state.overrides['__global.tmplPalette'] = palette;
            persist();
          }
          showTmplPickerModal(onPick);
        });
      };
    });
    chips.querySelectorAll('.modal-chip-del').forEach(delBtn=>{
      delBtn.onclick = (e)=>{
        e.stopPropagation();
        const label = delBtn.getAttribute('data-label');
        showConfirmModal('删除这个模板选项？', '不会影响已经套用在别处的同名内容，只是以后新增时清单里不会再出现它。', ()=>{
          const remaining = getTmplPalette().filter(t=>t.label!==label);
          state.overrides['__global.tmplPalette'] = remaining;
          persist();
          showTmplPickerModal(onPick);
        });
      };
    });
  }
  renderChips();
}
function showTagPickerModal(onPick){
  const overlay = document.getElementById('modalOverlay');
  const input = document.getElementById('modalInput');
  const chips = document.getElementById('modalChips');
  document.getElementById('modalTitle').textContent = '新增标签';
  document.getElementById('modalHint').style.display = 'block';

  input.placeholder = '新标签名称…';

    chips.innerHTML = palette.map(t=>`<span class="modal-chip" data-name="${esc(t.name)}" style="color:${t.color}; border-color:${t.color}">${esc(t.name)}<span class="modal-chip-del" data-name="${esc(t.name)}" title="从清单移除这个标签选项">×</span></span>`).join('');

});

/* ---- Archive (封存区): list every hidden/archived workflow tile, with
   restore (clear .hidden/.purged) and permanent delete for everyone. For
   user-created custom workflows, "permanent delete" actually purges the
   data (removed from the list + all its overrides wiped). Built-in
   workflows can't have their code-level definition removed, so "permanent
   delete" instead sets a .purged flag: once purged, they disappear from
   the grid, search, AND the archive list itself — there's simply no more
   UI path back to them (short of manually editing the exported overrides). ---- */
function getArchivedWorkflows(){
  const rows = [];
  getAllCatsRaw().forEach(cat=>{
    cat.workflows.forEach(wf=>{
      if(isWfHidden(wf.id) && !isWfPurged(wf.id)) rows.push({wf, cat});
    });
  });
  return rows;
}
function renderArchiveList(){
  const rows = getArchivedWorkflows();
  const list = document.getElementById('archiveList');
  if(!rows.length){
    list.innerHTML = '<div class="archive-empty">封存区目前是空的</div>';
    return;
  }
  list.innerHTML = rows.map(({wf,cat})=>{
    const title = stripHtml(ov(wf.id+'.title', wf.title) || '') || '(未命名)';
    return `<div class="archive-row">
      <div class="archive-row-info">
        <div class="archive-row-title">${esc(title)}</div>
        <div class="archive-row-cat">${esc(cat.name)}</div>
      </div>
      <div class="archive-row-actions">
        <button class="btn archive-restore-btn" data-wf="${wf.id}">↺ 还原</button>
        <button class="btn archive-purge-btn" data-wf="${wf.id}" data-cat="${cat.id}">✕ 永久删除</button>
      </div>
    </div>`;
  }).join('');
  list.querySelectorAll('.archive-restore-btn').forEach(btn=>{
    btn.onclick = ()=>{
      snapshotUndo();
      delete state.overrides[btn.getAttribute('data-wf')+'.hidden'];
      persist();
      renderArchiveList();
      renderTabs();
      renderStage();
    };
  });
  list.querySelectorAll('.archive-purge-btn').forEach(btn=>{
    btn.onclick = ()=>{
      const wfId = btn.getAttribute('data-wf'), catId = btn.getAttribute('data-cat');
      const isCustom = String(wfId).indexOf('wf_')===0;
      showConfirmModal('永久删除这个工作流程？', '这个动作无法复原，之后不会再出现在任何地方（包括封存区）。', ()=>{
        snapshotUndo();
        if(isCustom){
          state.overrides['__global.extraWorkflows.'+catId] = getExtraWorkflows(catId).filter(w=>w.id!==wfId);
          purgeOverridesByPrefix(wfId);
        } else {
          state.overrides[wfId+'.hidden'] = '1';
          state.overrides[wfId+'.purged'] = '1';
        }
        persist();
        renderArchiveList();
        renderTabs();
        renderStage();
      });
    };
  });
}

/* ---- floating selection toolbar (Bold / Italic / Link) ---- */
let ftTargetEl = null;
function getEditableFromNode(node){
  const el = node && (node.nodeType===3 ? node.parentElement : node);
  return el && el.closest ? el.closest('[contenteditable="true"]') : null;
}
function normalizeLinksToOpenInNewTab(el){
  el.querySelectorAll('a[href]').forEach(a=>{
    a.setAttribute('target', '_blank');
    a.setAttribute('rel', 'noopener noreferrer');
  });
}
function persistEditable(el){
  if(!el) return;
  normalizeLinksToOpenInNewTab(el);
  const key = el.getAttribute('data-ovkey');
  if(key){ state.overrides[key] = el.innerHTML; if(state.editMode) persist(); }
}
function hideFloatingToolbar(){
  document.getElementById('floatingToolbar').classList.remove('show');
  document.getElementById('ftSizeMenu').classList.remove('show');
  document.getElementById('ftColorMenu').classList.remove('show');
}
function getTitleSizeContext(editableEl){
  const tileTitleEl = editableEl.closest('.tile-title');
  if(tileTitleEl){
    const tile = tileTitleEl.closest('.tile[data-id]');
    if(tile) return { key: tile.getAttribute('data-id')+'.tileTitleSize', wrapperEl: tileTitleEl };
  }
  const detailTitleEl = editableEl.closest('.detail-title');
  if(detailTitleEl && state.activeWF){
    return { key: state.activeWF+'.detailTitleSize', wrapperEl: detailTitleEl };
  }
  return null;
}
function detectCurrentSize(editableEl){
  const titleCtx = getTitleSizeContext(editableEl);
  if(titleCtx){
    return state.overrides[titleCtx.key] || parseFloat(window.getComputedStyle(titleCtx.wrapperEl).fontSize) || 14;
  }
  if(editableEl.closest('.pickrow-label')){
    return state.overrides[SUBTITLE_SIZE_KEY] || 11;
  }
  const sel = window.getSelection();
  if(sel && sel.rangeCount){
    const node = sel.getRangeAt(0).startContainer;
    const el = node.nodeType===3 ? node.parentElement : node;
    if(el){
      const cs = window.getComputedStyle(el);
      const v = parseFloat(cs.fontSize);
      if(!isNaN(v)) return v;
    }
  }
  return 13;
}
function updateFloatingToolbar(){
  if(!state.editMode){ hideFloatingToolbar(); return; }
  const sel = window.getSelection();
  if(!sel || sel.rangeCount===0 || sel.isCollapsed){ hideFloatingToolbar(); return; }
  const editableEl = getEditableFromNode(sel.anchorNode);
  if(!editableEl){ hideFloatingToolbar(); return; }
  ftTargetEl = editableEl;
  const rect = sel.getRangeAt(0).getBoundingClientRect();
  if(rect.width===0 && rect.height===0){ hideFloatingToolbar(); return; }
  const bar = document.getElementById('floatingToolbar');
  bar.classList.add('show');
  const top = rect.top - bar.offsetHeight - 8;
  const left = rect.left + rect.width/2 - bar.offsetWidth/2;

function setSelectionColor(color){
  const sel = window.getSelection();
  if(!sel || sel.rangeCount===0 || sel.isCollapsed) return;
  const range = sel.getRangeAt(0);
  const frag = range.extractContents();
  if(frag.querySelectorAll) frag.querySelectorAll('*').forEach(el=>{ el.style.color = ''; });
  if(!color){
    range.insertNode(frag);
    sel.removeAllRanges();
  } else {
    const span = document.createElement('span');
    span.style.color = color;
    span.appendChild(frag);
    range.insertNode(span);
    sel.removeAllRanges();
    const r2 = document.createRange();
    r2.selectNodeContents(span);
    sel.addRange(r2);
  }
  persistEditable(ftTargetEl);
}
function setSelectionFontSize(size){
  const sel = window.getSelection();
  if(!sel || sel.rangeCount===0 || sel.isCollapsed) return;
  const range = sel.getRangeAt(0);
  const span = document.createElement('span');
  span.style.fontSize = size + 'px';
  const frag = range.extractContents();
  // clear any font-size set on nested elements from earlier edits, so this
  // new uniform size actually wins instead of being overridden by inner spans
  frag.querySelectorAll && frag.querySelectorAll('*').forEach(el=>{ el.style.fontSize = ''; });
  span.appendChild(frag);
  range.insertNode(span);
  sel.removeAllRanges();
  const r2 = document.createRange();
  r2.selectNodeContents(span);
  sel.addRange(r2);
  persistEditable(ftTargetEl);
}

document.getElementById('importTextApplyBtn').addEventListener('click', async ()=>{
  const raw = document.getElementById('exportTextArea').value;
  let parsed;
  try{
    parsed = JSON.parse(raw);
    if(!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) throw new Error('not an overrides object');
  }catch(err){
    alert('汇入失败：内容不是有效的 JSON，请确认整段都完整贴上了，或换个档案再试。');
    return;
  }
  // Safety net: whatever pasted/uploaded here — even a stale export from
  // before compression existed, or anything hand-edited — gets every image
  // squeezed through the same pipeline as a live paste. compressImageDataUrl
  // only swaps in the smaller result, so this can only shrink things, never
  // bloat them, and re-running it on an already-small image is a cheap no-op.
  const btn = document.getElementById('importTextApplyBtn');
  const oldLabel = btn.textContent;
  try{
    const imgKeys = Object.keys(parsed).filter(k=> k.endsWith('.imgData') && typeof parsed[k]==='string' && parsed[k].indexOf('data:image/')===0);
    const arrKeys = Object.keys(parsed).filter(k=> k.endsWith('.extraImages') && Array.isArray(parsed[k]));
    const totalImgs = imgKeys.length + arrKeys.reduce((n,k)=> n + parsed[k].length, 0);
    if(totalImgs){
      btn.textContent = `压缩图片中… (0/${totalImgs})`;
      let done = 0;
      for(const k of imgKeys){
        parsed[k] = await compressImageDataUrl(parsed[k], 1280, 0.72);
        done++; btn.textContent = `压缩图片中… (${done}/${totalImgs})`;
      }
      for(const k of arrKeys){
        const list = parsed[k];
        for(let i=0;i<list.length;i++){
          if(typeof list[i]==='string' && list[i].indexOf('data:image/')===0){
            list[i] = await compressImageDataUrl(list[i], 1280, 0.72);
          }
          done++; btn.textContent = `压缩图片中… (${done}/${totalImgs})`;
        }
      }
    }
  }catch(e){
    // If compression itself fails for any reason, fall back to importing the
    // original values untouched rather than blocking the import entirely.
  }
  btn.textContent = oldLabel;
  snapshotUndo();
  state.overrides = IS_APPS_SCRIPT ? wrapOverridesWithSyncProxy(parsed) : parsed;
  persist();
  document.getElementById('exportTextOverlay').classList.remove('open');
  renderTabs();
  renderStage();
  alert('汇入成功');
});

/* =========================================================
   INIT
========================================================= */
if(!state.overrides['__global.tagPalette']){
  state.overrides['__global.tagPalette'] = [
    {name:'Merchant', color:'#5B9DF9'},
    {name:'PSP', color:'#F5A524'},
    {name:'TGRGW', color:'#C084FC'},
  ];
  persist();
}
/* one-time migration: a new "V 已配对，未完成" option was inserted at position 1
   inside p1's Cancelled/Pending branch. Any override keyed by array index for
   position >=1 in that branch (labels, steps, images, tags, hidden-flags...) now
   points one slot too early. Shift those keys up by one so a person's earlier
   edits stay attached to the option they actually edited. */
/* =========================================================
   ONE-TIME MIGRATIONS
   Add future fixes here as {id, run()} — each runs at most once,
   guarded by its own '__global.migrated_<id>' flag, in list order.
========================================================= */
const MIGRATIONS = [
  { id: 'p1_v_matched_insert', run(){
      function escapeRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
      function shiftIndexedKeys(prefix, insertAt){
        const re = new RegExp('^'+escapeRe(prefix)+'(\\d+)(\\..*)?$');
        const matches = [];
        Object.keys(state.overrides).forEach(k=>{
          const m = k.match(re);
          if(m) matches.push({ key:k, idx:parseInt(m[1],10), rest:m[2]||'' });
        });
        matches.sort((a,b)=>b.idx-a.idx); // descending, so we never clobber a slot we still need to read
        matches.forEach(({key,idx,rest})=>{
          if(idx>=insertAt){
            const newKey = prefix+(idx+1)+rest;
            state.overrides[newKey] = state.overrides[key];
            delete state.overrides[key];
          }
        });
      }
      shiftIndexedKeys('p1.opt0.2.opt1.', 1);
      shiftIndexedKeys('p1::2.', 1);
  }},
  { id: 'p1_wfback_cleanup', run(){
      // the "SettleFlow back 异常回报" line went through a couple of iterations
      // (numbered step -> plain note -> unnumbered step-with-image). Clear
      // leftover state from the in-between "note" version, and any accidental
      // hide of the first "拿截图问PSP" step from testing along the way.
      delete state.overrides['p1.opt0.2.note'];
      delete state.overrides['p1.opt0.2.note.removed'];
      delete state.overrides['p1.opt0.2.step0.hidden'];
      delete state.overrides['p1.opt0.2.step1.hidden'];
  }},
  { id: 'split_tile_title', run(){
      // the tile card's title and the detail page's title used to read from
      // the same override key, so resizing/editing one silently changed the
      // other too. Snapshot each into an independent '.tileTitle' key first
      // (see the next migration) so nothing visibly changes right now.
      getAllCatsRaw().forEach(cat=>{
        cat.workflows.forEach(wf=>{
          const sharedKey = wf.id+'.title';
          const tileKey = wf.id+'.tileTitle';
          if(state.overrides[sharedKey] !== undefined && state.overrides[tileKey] === undefined){
            state.overrides[tileKey] = state.overrides[sharedKey];
          }
        });
      });
  }},
  { id: 'cleaned_tileTitle_dupe', run(){
      // the split above lasted only briefly before being reverted back to a
      // single shared title. If a person actually renamed a tile during that
      // window, '.tileTitle' now holds the ONLY record of that — promote it
      // into the shared '.title' key before removing it, so a real rename
      // survives instead of silently reverting.
      Object.keys(state.overrides).filter(k=>k.endsWith('.tileTitle')).forEach(k=>{
        const wfId = k.slice(0, -('.tileTitle'.length));
        const tileVal = state.overrides[k];
        const titleVal = state.overrides[wfId+'.title'];
        if(tileVal !== undefined && tileVal !== titleVal){
          state.overrides[wfId+'.title'] = tileVal;
        }
        delete state.overrides[k];
      });
  }},
  { id: 'seed_and_dedupe_tmpl_palette', run(){
      // seed the reusable-template palette with the confirm-template that
      // already exists twice in the schema (w1, w2) under one canonical
      // label, then fix up any manually-added copy that has the same
      // content but a different label (e.g. someone typed "确认" while
      // adding a reply template by hand, before the picker existed).
      const canonicalLabel = '内部讯息（请同事复核）';
      const canonicalTmpl = '请另一名人员进行确认，亲\n---\nKindly confirm with another member';
      const normalize = s => String(s||'').replace(/\s+/g,' ').trim();
      const palette = getTmplPalette();
      if(!palette.some(t=>normalize(t.tmpl)===normalize(canonicalTmpl))){
        palette.push({label: canonicalLabel, tmpl: canonicalTmpl});
        state.overrides['__global.tmplPalette'] = palette;
      }
      Object.keys(state.overrides).forEach(k=>{
        if(!k.endsWith('.extraReplies')) return;
        const list = state.overrides[k];
        if(!Array.isArray(list)) return;
        let touched = false;
        list.forEach(entry=>{
          if(entry && normalize(entry.tmpl)===normalize(canonicalTmpl) && entry.label!==canonicalLabel){
            entry.label = canonicalLabel;
            touched = true;
          }
        });
        if(touched) state.overrides[k] = list;
      });
  }},
  { id: 'seed_and_dedupe_tmpl_palette_2', run(){
      // same idea as the migration above, extended to the rest of the
      // templates that are genuinely reused verbatim across workflows
      // (w1/w2's Settlement + remark templates), so the "+ 新增回覆模板"
      // picker offers all of them, and any manually-added copy with a
      // different label gets normalized to match.
      const normalize = s => String(s||'').replace(/\s+/g,' ').trim();
      const canonical = [
        { label:'需提供给 Settlement 的资讯', tmpl:'Order ID\nmerchant ID' },
        { label:'备注内容', tmpl:'paid via OTC wallet / SettleFlow Pay + new HASH ID' },
        { label:'请 Settlement 确认', tmpl:'SettleFlow ~ [Order ID]\nSettleFlow HashID\n\nKindly confirm whether we received this, thank you! 🙇\u200d♀️\n[tronscan link]' },
      ];
      const palette = getTmplPalette();
      let paletteChanged = false;
      canonical.forEach(c=>{
        if(!palette.some(t=>normalize(t.tmpl)===normalize(c.tmpl))){
          palette.push(c);
          paletteChanged = true;
        }
      });
      if(paletteChanged) state.overrides['__global.tmplPalette'] = palette;
      Object.keys(state.overrides).forEach(k=>{
        if(!k.endsWith('.extraReplies')) return;
        const list = state.overrides[k];
        if(!Array.isArray(list)) return;
        let touched = false;
        list.forEach(entry=>{
          const match = canonical.find(c=>entry && normalize(entry.tmpl)===normalize(c.tmpl));
          if(match && entry.label!==match.label){
            entry.label = match.label;
            touched = true;
          }
        });
        if(touched) state.overrides[k] = list;
      });
  }},
  { id: 'recompress_legacy_images', async run(){
      // Any image saved before the WebP-first compression pipeline existed
      // (or brought in by some other older path) is sitting here as a raw,
      // uncompressed data URI and will never shrink on its own just from
      // normal use — only re-saving the image or re-importing overrides
      // touches it. Sweep every .imgData / .extraImages entry once here so
      // it's fixed automatically, the same way importing already is.
      // compressImageDataUrl only keeps the result if it's smaller, so this
      // is always safe to run even on images that are already small.
      const imgKeys = Object.keys(state.overrides).filter(k=> k.endsWith('.imgData') && typeof state.overrides[k]==='string' && state.overrides[k].indexOf('data:image/')===0);
      const arrKeys = Object.keys(state.overrides).filter(k=> k.endsWith('.extraImages') && Array.isArray(state.overrides[k]));
      for(const k of imgKeys){
        try{ state.overrides[k] = await compressImageDataUrl(state.overrides[k], 1280, 0.72); }catch(e){}
      }
      for(const k of arrKeys){
        const list = state.overrides[k].slice();
        for(let i=0;i<list.length;i++){
          if(typeof list[i]==='string' && list[i].indexOf('data:image/')===0){
            try{ list[i] = await compressImageDataUrl(list[i], 1280, 0.72); }catch(e){}
          }
        }
        state.overrides[k] = list;
      }
  }},
];
async function runMigrationsOnce(){
  let changed = false;
  for(const m of MIGRATIONS){
    const flag = '__global.migrated_'+m.id;
    if(!state.overrides[flag]){
      await m.run();
      state.overrides[flag] = '1';
      changed = true;
    }
  }
  if(changed) persist();
}
function finishInit(){
  runMigrationsOnce();
  // land on whichever tab is currently FIRST in the person's own tab order
  // (they may have dragged a different category to the front), not whichever
  // category happens to be first in this file's source code.
  try{ const firstTab = getCatTabOrder()[0]; if(firstTab) state.activeCat = firstTab.id; }catch(e){}
  // then, if this browser was last sitting on a specific page, go back there
  // instead — but only if that category/workflow still actually exists.
  try{
    const last = loadLastView();
    if(last && last.cat && getCatTabOrder().some(c=>c.id===last.cat)){
      state.activeCat = last.cat;
      if(last.wf && findWF(last.wf) && !isWfHidden(last.wf)){
        state.activeWF = last.wf;
        state.path = Array.isArray(last.path) ? last.path : [0,0,0];
      }
    }
  }catch(e){}
  applySubtitleSize();
  renderTabs();
  renderStage();
  if(IS_APPS_SCRIPT) setInterval(pollRemoteState, SYNC_POLL_MS);
}
if(IS_APPS_SCRIPT){
  document.body.classList.add('sync-loading');
  let initSettled = false;
  const initTimeout = setTimeout(()=>{
    // hard safety net: if getState() never calls back (blocked, wrong
    // environment, network hiccup...), never leave the page stuck behind
    // the loading overlay — just fall back to local-only and carry on.
    if(initSettled) return;
    initSettled = true;
    console.error('initial shared-state fetch timed out, starting from local cache');
    document.body.classList.remove('sync-loading');
    finishInit();
    setSyncStatus('err');
  }, 8000);
  try{
    google.script.run
      .withSuccessHandler((result)=>{
        if(initSettled) return;
        initSettled = true; clearTimeout(initTimeout);
        applyingRemoteMerge = true;
        try{ Object.keys(result.overrides).forEach(k=>{ state.overrides[k] = result.overrides[k]; }); }
        finally{ applyingRemoteMerge = false; }
        document.body.classList.remove('sync-loading');
        finishInit();
        setSyncStatus('ok');
      })
      .withFailureHandler((err)=>{
        if(initSettled) return;
        initSettled = true; clearTimeout(initTimeout);
        console.error('initial shared-state fetch failed, starting from local cache:', err);
        document.body.classList.remove('sync-loading');
        finishInit();
        setSyncStatus('err');
      })
      .getState();
  }catch(e){
    if(!initSettled){
      initSettled = true; clearTimeout(initTimeout);
      console.error('google.script.run.getState() threw synchronously, starting from local cache:', e);
      document.body.classList.remove('sync-loading');
      finishInit();
    }
  }
} else {
  finishInit();
}
